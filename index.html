// ── Quick spend log ──────────────────────────────────────────────────
// Deliberately fast: this gets used standing in a checkout line, so amount is
// focused on open and everything else has a sane default.
function SpendSheet({initial,accounts,defaultAcct,onSave,onCancel}){
  const [sp,setSp]=useState(initial||{id:uid(),date:ymd(new Date()),
    category:"Food & Dining",amount:"",accountId:defaultAcct,note:""});
  const s=(k,v)=>setSp(p=>({...p,[k]:v}));
  const ok=sp.amount!==""&&parseFloat(sp.amount)>0&&sp.accountId
    &&/^\d{4}-\d{2}-\d{2}$/.test(sp.date||"");
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(20,18,14,0.45)",zIndex:500,
                 display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={ev=>{if(ev.target===ev.currentTarget)onCancel();}}>
      <div style={{background:C.card,width:"100%",maxWidth:480,maxHeight:"88vh",
                   borderRadius:"18px 18px 0 0",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 18px 12px",borderBottom:`1px solid ${C.border}`,
                     display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:800,fontSize:16}}>{initial?"Edit spend":"Log a spend"}</div>
          <button onClick={onCancel} style={{border:"none",background:"transparent",fontSize:20,
            color:C.sub,cursor:"pointer",padding:4}}>×</button>
        </div>
        <div style={{padding:18,overflowY:"auto",display:"flex",flexDirection:"column",gap:14}}>
          <div><Lab>Amount</Lab>
            <Inp type="number" inputMode="decimal" step="0.01" placeholder="0.00" autoFocus
              value={sp.amount} onChange={v=>s("amount",v.target.value)}
              style={{fontSize:22,fontWeight:700,textAlign:"right"}}/></div>
          <div><Lab>Category</Lab>
            <Sel value={sp.category} onChange={v=>s("category",v.target.value)}>
              {CATS.filter(c=>c!=="Income"&&c!=="Transfer").map(c=><option key={c}>{c}</option>)}
            </Sel></div>
          <div><Lab>Paid with</Lab>
            <Sel value={sp.accountId} onChange={v=>s("accountId",v.target.value)}>
              {accounts.map(a=><option key={a.id} value={a.id}>
                {a.name}{a.kind==="liability"?" (card)":""}</option>)}
            </Sel></div>
          <div><Lab>Date</Lab>
            <Inp type="date" value={sp.date} onChange={v=>s("date",v.target.value)}/></div>
          <div><Lab>Note (optional)</Lab>
            <Inp placeholder="Loblaws" value={sp.note} onChange={v=>s("note",v.target.value)}/></div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:16,
                     borderTop:`1px solid ${C.border}`}}>
          <Btn v="ghost" onClick={onCancel}>Cancel</Btn>
          <Btn onClick={()=>ok&&onSave(sp)} style={{opacity:ok?1:.4}}>Save</Btn>
        </div>
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────
function App(){
  const [st,setSt]=useState(()=>migrate(load()));
  const [tab,setTab]=useState("home");
  const [scope,setScope]=useState(()=>
    (st.accounts.find(a=>a.kind!=="liability")||st.accounts[0])?.id||"");
  const [form,setForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [showAll,setShowAll]=useState(false);
  const [postedOpen,setPostedOpen]=useState(false);
  const [year,setYear]=useState(String(new Date().getFullYear()));
  const [recOpen,setRecOpen]=useState(false);
  const [recVal,setRecVal]=useState("");
  const [yearMode,setYearMode]=useState("all");
  const [acctForm,setAcctForm]=useState(null);
  const [spendOpen,setSpendOpen]=useState(false);
  const [editSpend,setEditSpend]=useState(null);
  const [spendListOpen,setSpendListOpen]=useState(false);
  const [budgetEdit,setBudgetEdit]=useState(null);
  const [restoreText,setRestoreText]=useState("");
  const [backupMsg,setBackupMsg]=useState("");

  useEffect(()=>{save(st);},[st]);
  useEffect(()=>{
    const cash=st.accounts.filter(a=>a.kind!=="liability");
    if(cash.length && !cash.some(a=>a.id===scope)) setScope(cash[0].id);
  },[st.accounts,scope]);
  const up=useCallback((k,v)=>setSt(p=>({...p,[k]:v})),[]);
  const acctById=useMemo(()=>Object.fromEntries(st.accounts.map(a=>[a.id,a])),[st.accounts]);

  // The forecast horizon is dictated by the entries themselves — the furthest-out
  // end date (or start date, for one-time entries) among everything loaded.
  const forecastYear=useMemo(()=>{
    const thisYear=new Date().getFullYear();
    if(!st.entries.length) return thisYear+1;
    const years=st.entries.map(e=>{
      const d=e.endDate||e.startDate||"";
      return parseInt(d.slice(0,4),10)||thisYear+1;
    });
    return Math.max(thisYear,...years);
  },[st.entries]);

  // Build every occurrence across every account, including mirrored transfers
  const ALL=useMemo(()=>{
    const end=new Date(forecastYear,11,31);
    const occ=[];
    for(const e of st.entries){
      const sign=(e.type==="expense"||e.type==="transfer")?-1:1;
      const amt=Math.abs(parseFloat(e.amount)||0);
      for(const d of occurrences(e,end)){
        const key=e.id+"|"+d;
        const a=st.actuals[key];
        const internal=!!(e.type==="transfer"&&e.toAccountId&&acctById[e.toAccountId]);
        const ticked=!!st.cleared[key], confirmed=a!==undefined;
        occ.push({key,date:d,accountId:e.accountId,name:e.name,vendor:e.vendor,category:e.category,
          type:e.type,forecast:sign*amt,amount:sign*(confirmed?Math.abs(a):amt),
          actual:a,ticked,posted:ticked&&confirmed,awaiting:ticked&&!confirmed,
          isSplit:!!e.split,isIncome:e.type==="income",trackedCats:e.trackedCats||[],
          split:st.splits?.[key]||null,gross:st.grosses?.[key],
          incomeLines:(e.incomeItems||[]).map(it=>it.name),
          grossSplit:st.grossSplits?.[key]||null,
          typicalGross:e.incomeItems&&e.incomeItems.length
            ?e.incomeItems.reduce((a,it)=>a+(parseFloat(it.amount)||0),0):undefined,
          typicalIncomeLines:Object.fromEntries((e.incomeItems||[]).map(it=>[it.name,it.amount])),
          typicalSplit:e.typicalDeductions||{},
          mirror:false,internal});
        // mirrored inbound leg of an internal transfer
        if(e.type==="transfer"&&e.toAccountId&&acctById[e.toAccountId]){
          const mk=key+"|in";
          const ma=st.actuals[mk];
          const mTicked=!!st.cleared[mk], mConf=ma!==undefined;
          occ.push({key:mk,date:d,accountId:e.toAccountId,name:e.name,
            vendor:acctById[e.accountId]?.name||"",category:"Transfer",type:"income",
            forecast:amt,amount:(mConf?Math.abs(ma):amt),
            actual:ma,ticked:mTicked,posted:mTicked&&mConf,awaiting:mTicked&&!mConf,
            mirror:true,internal:true});
        }
      }
    }
    occ.sort((a,b)=>a.date.localeCompare(b.date)||a.key.localeCompare(b.key));
    return occ;
  },[st,acctById]);

  const cards=useMemo(()=>st.accounts.filter(a=>a.kind==="liability"),[st.accounts]);

  // ── Card billing cycles ────────────────────────────────────────────
  // Every logged spend on a card lands in the statement cycle that captures
  // its date. The payment for that cycle is derived, never typed.
  const cardCycles=useMemo(()=>{
    const out={};
    for(const c of cards){
      const byClose={};
      const bucket=(dateStr)=>{
        const close=cycleCloseFor(dateStr,c.closeDay);
        const ck=ymd(close);
        if(!byClose[ck]) byClose[ck]={close,closeKey:ck,items:[],total:0,
          due:ymd(dueDateFor(close,c.closeDay,c.dueDay)),
          pay:ymd(dueDateFor(close,c.closeDay,c.payDay??c.dueDay))};
        return byClose[ck];
      };
      for(const sp of st.spends){
        if(sp.accountId!==c.id) continue;
        const b=bucket(sp.date);
        b.items.push({name:sp.note||sp.category,amount:Math.abs(parseFloat(sp.amount)||0)});
        b.total+=Math.abs(parseFloat(sp.amount)||0);
      }
      // Recurring charges billed straight to the card — a mobile plan or a
      // subscription. No cash moves on the charge date; it lands on the statement.
      for(const o of ALL){
        if(o.accountId!==c.id||o.type!=="expense") continue;
        const b=bucket(o.date);
        const amt=Math.abs(o.posted?o.amount:o.forecast);
        b.items.push({name:o.name,amount:amt});
        b.total+=amt;
      }
      const openBal=Math.abs(parseFloat(c.opening)||0);
      if(openBal>0){
        const b=bucket(ymd(new Date()));
        b.total+=openBal; b.carried=openBal;
      }
      out[c.id]=Object.values(byClose).sort((a,b)=>a.closeKey.localeCompare(b.closeKey));
    }
    return out;
  },[cards,st.spends,ALL]);

  // Derived card payment rows — an expense on the funding account, due on the
  // card's due day, for whatever that cycle actually came to.
  const cardPayments=useMemo(()=>{
    const rows=[];
    for(const c of cards){
      const fund=st.accounts.find(a=>a.id===c.payFrom&&a.kind==="asset")
              || st.accounts.find(a=>a.kind==="asset");
      if(!fund) continue;
      for(const cyc of (cardCycles[c.id]||[])){
        if(cyc.total<=0) continue;
        const amt=c.payRule==="fixed"?Math.abs(parseFloat(c.payFixed)||0)
                 :c.payRule==="minimum"?Math.max(10,cyc.total*0.03)
                 :cyc.total;
        if(amt<=0) continue;
        const key="card|"+c.id+"|"+cyc.closeKey;
        const a=st.actuals[key];
        const ticked=!!st.cleared[key], confirmed=a!==undefined;
        rows.push({key,date:cyc.pay||cyc.due,accountId:fund.id,
          name:c.name+" payment",vendor:"due "+pretty(cyc.due),category:"Credit card",type:"expense",
          forecast:-amt,amount:-(confirmed?Math.abs(a):amt),
          actual:a,ticked,posted:ticked&&confirmed,awaiting:ticked&&!confirmed,
          isSplit:false,isIncome:false,trackedCats:[],
          derived:true,cardId:c.id,cycleKey:cyc.closeKey,mirror:false,internal:false});
      }
    }
    return rows;
  },[cards,cardCycles,st.accounts,st.actuals,st.cleared]);

  // A spend on a cash account is money that has already left the account, so it
  // posts to the ledger straight away — no cleared checkbox, it is a fact, not a
  // forecast. A spend on a card moves no cash and stays out until the payment.
  const cashSpends=useMemo(()=>st.spends
    .filter(sp=>acctById[sp.accountId]&&acctById[sp.accountId].kind!=="liability")
    .map(sp=>{
      const amt=Math.abs(parseFloat(sp.amount)||0);
      return {key:"spend|"+sp.id,date:sp.date,accountId:sp.accountId,
        name:sp.note||sp.category,vendor:"",category:sp.category,type:"expense",
        forecast:-amt,amount:-amt,actual:amt,
        ticked:true,posted:true,awaiting:false,
        isSplit:false,isIncome:false,trackedCats:[],
        logged:true,spendId:sp.id,mirror:false,internal:false};
    }),[st.spends,acctById]);

  const ALL2=useMemo(()=>{
    const merged=[...ALL,...cardPayments,...cashSpends];
    merged.sort((a,b)=>a.date.localeCompare(b.date)||a.key.localeCompare(b.key));
    return merged;
  },[ALL,cardPayments,cashSpends]);

  // Run the balance engine over a set of occurrences and an opening balance
  const engine=useCallback((occ,opening)=>{
    // A row only moves the current balance once its actual amount has been
    // confirmed. Ticking the box alone is not enough.
    let nPosted=0,nAwaiting=0;
    const postedRun=[]; let runP=opening;
    for(const o of occ) if(o.posted){runP+=o.amount;postedRun.push({...o,runBal:runP});nPosted++;}
    const current=runP;
    const fc=[]; let run=current,low=current,lowDate=null;
    for(const o of occ){
      if(o.posted)continue;
      if(o.awaiting)nAwaiting++;
      run+=o.forecast;
      fc.push({...o,runBal:run});
      if(run<low){low=run;lowDate=o.date;}
    }
    // "Available" at any given row = the lowest the balance ever dips to from
    // that row onward — a running look-ahead, not just the account-wide low point.
    let suffixMin=Infinity;
    for(let i=fc.length-1;i>=0;i--){
      suffixMin=Math.min(suffixMin,fc[i].runBal);
      fc[i].avail=suffixMin;
    }
    return {current,available:low,lowDate,nPosted,nAwaiting,fc,occ,postedRun};
  },[]);

  // Per-account results, and the combined household view. Cashflow is a cash
  // question, so only asset accounts get a running balance; a card's position
  // is its cycle balance, not a chequing-style ledger.
  const perAccount=useMemo(()=>st.accounts.filter(a=>a.kind!=="liability").map(a=>({
    account:a, ...engine(ALL2.filter(o=>o.accountId===a.id),parseFloat(a.opening)||0)
  })),[st.accounts,ALL2,engine]);

  const combinedOpening=st.accounts.filter(a=>a.kind!=="liability")
    .reduce((s,a)=>s+(parseFloat(a.opening)||0),0);
  const combined=useMemo(()=>engine(
      ALL2.filter(o=>!o.internal && acctById[o.accountId]?.kind!=="liability"),combinedOpening),
    [ALL2,combinedOpening,engine,acctById]);

  // What is still owed across all cards — the claim sitting beside your cash.
  const cardDebt=useMemo(()=>cards.reduce((s,c)=>{
    const cycs=cardCycles[c.id]||[];
    const unpaid=cycs.reduce((t,cy)=>{
      const key="card|"+c.id+"|"+cy.closeKey;
      return t+(st.actuals[key]!==undefined?0:cy.total);
    },0);
    return s+unpaid;
  },0),[cards,cardCycles,st.actuals]);

  // ── Budgets ────────────────────────────────────────────────────────
  // Budgets sit beside the ledger, not inside it. They read logged spends by
  // SPEND date (when you committed the money), which is a different clock from
  // when cash settles. Nothing here ever writes to the books.
  const [budgetMonth,setBudgetMonth]=useState(()=>monthKey(new Date()));

  // Money already gone: logged spends, plus confirmed recurring expenses.
  const spentByCatMonth=useMemo(()=>{
    const m={};
    const add=(mk,cat,amt)=>{ if(!m[mk])m[mk]={}; m[mk][cat]=(m[mk][cat]||0)+amt; };
    for(const sp of st.spends)
      add(monthKey(sp.date),sp.category||"Other",Math.abs(parseFloat(sp.amount)||0));
    for(const o of ALL2){
      if(o.type!=="expense"||!o.posted||o.logged||o.derived) continue;
      const mk=monthKey(o.date), amt=Math.abs(o.amount);
      if(o.isSplit&&o.split&&Object.keys(o.split).length){
        let itemised=0;
        for(const [cat,v] of Object.entries(o.split)){
          const n=Math.abs(parseFloat(v)||0); itemised+=n; add(mk,cat,n);
        }
        const rest=amt-itemised;
        if(rest>0.005) add(mk,o.category||"Other",rest);
      } else add(mk,o.category||"Other",amt);
    }
    return m;
  },[st.spends,ALL2]);

  // Money spoken for but not yet confirmed: any uncleared entry occurrence in
  // the month, whether its date has passed or not. A bill you have not ticked
  // off is still owed, so the budget must not pretend that money is free.
  const plannedByCatMonth=useMemo(()=>{
    const m={};
    for(const o of ALL2){
      if(o.type!=="expense"||o.posted||o.logged||o.derived) continue;
      const mk=monthKey(o.date), c=o.category||"Other";
      if(!m[mk])m[mk]={};
      m[mk][c]=(m[mk][c]||0)+Math.abs(o.forecast);
    }
    return m;
  },[ALL2]);

  // What the budget measures against: everything committed this month.
  const committedByCatMonth=useMemo(()=>{
    const m={};
    for(const src of [spentByCatMonth,plannedByCatMonth])
      for(const [mk,cats] of Object.entries(src)){
        if(!m[mk])m[mk]={};
        for(const [c,v] of Object.entries(cats)) m[mk][c]=(m[mk][c]||0)+v;
      }
    return m;
  },[spentByCatMonth,plannedByCatMonth]);

  // Carry-forward walks every month from the first activity up to the one asked
  // for, so an overspend in March still shows against June. A reset clears the
  // running carry at that month and is recorded as an event.
  const carryFor=useCallback((cat,uptoMk)=>{
    const budget=parseFloat(st.budgets[cat])||0;
    const months=Object.keys(committedByCatMonth).sort();
    if(!months.length) return 0;
    let mk=months[0];
    if(mk>=uptoMk) return 0;
    let carry=0;
    while(mk<uptoMk){
      const wasReset=st.budgetResets.some(r=>r.category===cat&&r.month===mk);
      if(wasReset) carry=0;
      else carry+=budget-(committedByCatMonth[mk]?.[cat]||0);
      mk=addMonthKey(mk,1);
    }
    if(st.budgetResets.some(r=>r.category===cat&&r.month===uptoMk)) carry=0;
    return carry;
  },[st.budgets,st.budgetResets,committedByCatMonth]);


  const budgetByCat=useMemo(()=>{
    const out={};
    for(const cat of BUDGET_CATS){
      const budget=parseFloat(st.budgets[cat])||0;
      const spent=spentByCatMonth[budgetMonth]?.[cat]||0;
      const planned=plannedByCatMonth[budgetMonth]?.[cat]||0;
      const carry=carryFor(cat,budgetMonth);
      out[cat]={cat,budget,spent,planned,carry,
        left:budget+carry-spent-planned};
    }
    return out;
  },[st.budgets,spentByCatMonth,plannedByCatMonth,budgetMonth,carryFor]);

  const budgetTotals=useMemo(()=>{
    const rows=Object.values(budgetByCat);
    const live=b=>b.budget>0||b.spent>0||b.planned>0;
    return {budget:rows.reduce((s,b)=>s+b.budget,0),
            spent:rows.reduce((s,b)=>s+b.spent,0),
            planned:rows.reduce((s,b)=>s+b.planned,0),
            left:rows.reduce((s,b)=>s+(live(b)?b.left:0),0)};
  },[budgetByCat]);

  const commitBudget=useCallback((cat,val)=>setSt(p=>{
    const nb={...p.budgets};
    const n=parseFloat(val);
    if(val===""||isNaN(n)||n<=0) delete nb[cat]; else nb[cat]=n;
    if(String(nb[cat]??"")===String(p.budgets[cat]??"")) return p;  // no change, no re-render
    return {...p,budgets:nb};
  }),[]);

  const resetCarry=useCallback(row=>{
    if(!window.confirm(`Clear the $${Math.abs(row.carry).toFixed(2)} carried into ${prettyMonth(budgetMonth)} for ${row.cat}?\n\nThis is recorded so you can see it later.`))return;
    setSt(p=>({...p,budgetResets:[...p.budgetResets,
      {id:uid(),category:row.cat,month:budgetMonth,amount:row.carry,at:ymd(new Date())}]}));
  },[budgetMonth]);

  const monthSpends=useMemo(()=>st.spends
    .filter(sp=>monthKey(sp.date)===budgetMonth)
    .sort((a,b)=>b.date.localeCompare(a.date)),[st.spends,budgetMonth]);

  const M = perAccount.find(p=>p.account.id===scope)||combined;
  const scopeAcct = acctById[scope];
  const lineColor = scopeAcct?scopeAcct.color:C.accent;

  const monthly=useMemo(()=>{
    const mm={};
    for(const p of M.fc){
      const d=parseDate(p.date),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      if(!mm[k])mm[k]={income:0,expense:0,bal:p.runBal};
      if(p.forecast>0)mm[k].income+=p.forecast; else mm[k].expense+=Math.abs(p.forecast);
      mm[k].bal=p.runBal;
    }
    return Object.keys(mm).sort().map(k=>({label:MON[+k.slice(5,7)-1]+" '"+k.slice(2,4),
      income:mm[k].income,expense:mm[k].expense,balance:mm[k].bal}));
  },[M.fc]);
  let line=monthly;
  if(line.length>60){const s=Math.ceil(line.length/60);line=line.filter((_,i)=>i%s===0||i===monthly.length-1);}

  const breakdown=useMemo(()=>{
    const spend={},ded={}; let spendTotal=0,dedTotal=0,nSpend=0,nDed=0;
    for(const o of M.occ){
      if(!o.posted||!o.isSplit) continue;
      const net=Math.abs(o.actual||0);
      let itemised=0;
      const bucket=o.isIncome?ded:spend;
      for(const [k,v] of Object.entries(o.split||{})){
        const a=+v||0; itemised+=a; bucket[k]=(bucket[k]||0)+a;
      }
      if(o.isIncome){
        const gross=+o.gross||0;
        if(gross<=0) continue;
        nDed++; dedTotal+=gross-net;
        const other=gross-net-itemised;
        if(other>0.005) ded["Other deductions"]=(ded["Other deductions"]||0)+other;
      }else{
        nSpend++; spendTotal+=net;
        const other=net-itemised;
        if(other>0.005) spend["Other"]=(spend["Other"]||0)+other;
      }
    }
    const sort=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
    return {spend:sort(spend),spendTotal,nSpend,ded:sort(ded),dedTotal,nDed};
  },[M.occ]);

  const years=useMemo(()=>{
    const s=new Set();
    for(const o of M.occ) s.add(o.date.slice(0,4));
    const y=[...s].sort();
    return y.length?y:[String(new Date().getFullYear())];
  },[M.occ]);

  useEffect(()=>{ if(years.length&&!years.includes(year)) setYear(years[0]); },[years,year]);

  const annual=useMemo(()=>{
    const rows=M.occ.filter(o=>o.date.slice(0,4)===year&&(yearMode==="all"||o.posted));
    let inc=0,exp=0,gross=0,netPay=0,nPay=0,nConfirmed=0;
    const inCat={},outCat={},spend={},ded={};
    const months=Array.from({length:12},()=>({income:0,expense:0}));
    for(const o of rows){
      const amt=o.posted?o.amount:o.forecast;
      const m=+o.date.slice(5,7)-1;
      if(!(m>=0&&m<12)) continue;   // malformed date, cannot be placed in a month
      const cat=o.category||"Other";
      if(o.posted) nConfirmed++;
      if(amt>0){inc+=amt;months[m].income+=amt;inCat[cat]=(inCat[cat]||0)+amt;}
      else{exp+=-amt;months[m].expense+=-amt;outCat[cat]=(outCat[cat]||0)+(-amt);}
      if(o.posted&&o.isSplit){
        const items=Object.entries(o.split||{});
        const sum=items.reduce((s,[,v])=>s+(+v||0),0);
        if(o.isIncome){
          const g=+o.gross||0;
          if(g>0){
            gross+=g; netPay+=Math.abs(o.amount); nPay++;
            items.forEach(([k,v])=>ded[k]=(ded[k]||0)+(+v||0));
            const oth=g-Math.abs(o.amount)-sum;
            if(oth>0.005) ded["Other deductions"]=(ded["Other deductions"]||0)+oth;
          }
        }else{
          items.forEach(([k,v])=>spend[k]=(spend[k]||0)+(+v||0));
          const oth=Math.abs(o.amount)-sum;
          if(oth>0.005) spend["Other"]=(spend["Other"]||0)+oth;
        }
      }
    }
    const sort=x=>Object.entries(x).sort((a,b)=>b[1]-a[1]);
    return {inc,exp,net:inc-exp,inCat:sort(inCat),outCat:sort(outCat),
      spend:sort(spend),ded:sort(ded),gross,netPay,nPay,
      months:months.map((m,i)=>({label:MON[i],income:m.income,expense:m.expense})),
      count:rows.length,nConfirmed};
  },[M.occ,year,yearMode]);

  const fmt=n=>st.symbol+Math.abs(n).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2});
  const committed=M.current-M.available;

  // Which account a reconciliation would apply to
  const recAcct = acctById[scope];
  const recDiff = recVal.trim()==="" ? null : (parseFloat(recVal)||0)-M.current;

  const postAdjustment=()=>{
    if(!recAcct||recDiff===null||Math.abs(recDiff)<0.005) return;
    const id=uid(), date=ymd(new Date()), key=id+"|"+date;
    const entry={id,accountId:recAcct.id,toAccountId:"",
      type:recDiff>0?"income":"expense",name:"Reconcile adjustment",vendor:"",
      category:"Reconcile",split:false,trackedCats:[],grossAmount:"",
      amount:String(Math.abs(recDiff).toFixed(2)),startDate:date,endDate:date,
      frequency:"once",monthlyDay:1,dowIndex:2,nthWeek:1,customInterval:1,customUnit:"months"};
    setSt(p=>({...p,entries:[...p.entries,entry],
      cleared:{...p.cleared,[key]:true},
      actuals:{...p.actuals,[key]:Math.abs(recDiff)}}));
    setRecVal(""); setRecOpen(false);
  };
  const postedRows=M.postedRun;
  const fcShown=showAll?M.fc:M.fc.slice(0,60);
  // Entries are listed across every account — the account is chosen on the first
  // page of the wizard, so there is no scope to filter by here.
  const visibleEntries=st.entries;
  const TABS=[["home","Home","◎"],["entries","Entries","≡"],["ledger","Ledger","▤"],
              ["budget","Budget","◑"],["setup","Setup","⚙"]];

  // Account scope switcher
  const Scoper=()=>(
    <div className="scroll" style={{display:"flex",gap:7,overflowX:"auto",padding:"1px 0 3px",marginBottom:2}}>
      {st.accounts.filter(a=>a.kind!=="liability").map(a=>{
        const on=scope===a.id;
        return (<button key={a.id} onClick={()=>setScope(a.id)}
          style={{flexShrink:0,padding:"7px 14px",borderRadius:99,fontSize:13,fontWeight:700,cursor:"pointer",
            border:`1px solid ${on?a.color:C.border}`,background:on?a.color:C.card,color:on?"#fff":C.sub}}>
          {a.name}</button>);
      })}
    </div>
  );

  return (
    <div>
      <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:50,
                   paddingTop:"env(safe-area-inset-top,0px)"}}>
        <div style={{maxWidth:640,margin:"0 auto",height:52,display:"flex",alignItems:"center",
                     justifyContent:"space-between",padding:"0 16px"}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:25,height:25,borderRadius:7,background:C.accent,color:"#fff",fontWeight:800,
                         fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>L</div>
            <span style={{fontWeight:800,fontSize:17,letterSpacing:"-.02em"}}>Ledgerwise</span>
          </div>
          <span style={{fontSize:12,color:C.sub}}>to {forecastYear}</span>
        </div>
      </div>

      <div style={{maxWidth:640,width:"100%",margin:"0 auto",padding:"14px 6px"}}>

      {/* ── HOME ── */}
      {tab==="home" && (
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <Btn onClick={()=>{setEditSpend(null);setSpendOpen(true);}}
            style={{width:"100%",padding:"15px 20px",fontSize:16.5}}>+ Log spend</Btn>
          <Scoper/>
          <Card style={{borderTop:`3px solid ${C.dark}`}}>
            <Lab>{scopeAcct?.name+" · current"}</Lab>
            <div style={{fontSize:36,fontWeight:800,letterSpacing:"-.035em",lineHeight:1.05,marginTop:3,
                         color:M.current<0?C.expense:C.dark}}>
              {M.current<0?"−":""}{fmt(M.current)}
            </div>
            <div style={{fontSize:12,color:C.sub,marginTop:7}}>
              Opening balance plus {M.nPosted} confirmed transaction{M.nPosted===1?"":"s"}
            </div>
            {M.nAwaiting>0 &&
              <div onClick={()=>setTab("ledger")}
                style={{marginTop:10,background:"#fff7ed",border:"1px solid #fdba74",borderRadius:8,
                        padding:"9px 11px",fontSize:12.5,color:"#9a3412",cursor:"pointer",fontWeight:600}}>
                {M.nAwaiting} cleared row{M.nAwaiting===1?"":"s"} still need{M.nAwaiting===1?"s":""} an actual amount →
              </div>}
          </Card>

          <Card style={{borderTop:`3px solid ${M.available<0?C.expense:lineColor}`}}>
            <Lab>Available to spend</Lab>
            <div style={{fontSize:36,fontWeight:800,letterSpacing:"-.035em",lineHeight:1.05,marginTop:3,
                         color:M.available<0?C.expense:lineColor}}>
              {M.available<0?"−":""}{fmt(M.available)}
            </div>
            <div style={{fontSize:12,color:C.sub,marginTop:7}}>
              {M.lowDate
                ? <>Lowest point in the forecast, on <strong style={{color:C.text}}>{pretty(M.lowDate)}</strong></>
                : M.fc.length?"Balance never dips below today's":"No forecast entries yet"}
            </div>
            {committed>0.005 &&
              <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`,fontSize:12.5,color:C.sub}}>
                <strong style={{color:C.text}}>{fmt(committed)}</strong> of this balance is already committed.
              </div>}
            {M.available<0 &&
              <div style={{marginTop:10,background:"#fef2f2",borderRadius:8,padding:"9px 11px",
                           fontSize:12.5,fontWeight:600,color:C.expense}}>
                {M.lowDate?`Goes overdrawn on ${pretty(M.lowDate)}`:"Balance is already below zero"}
              </div>}
          </Card>

          {cardDebt>0.005 &&
            <Card style={{borderTop:`3px solid ${C.expense}`}}>
              <Lab>Owing on cards</Lab>
              <div style={{fontSize:26,fontWeight:800,letterSpacing:"-.03em",marginTop:3,color:C.expense}}>
                {fmt(cardDebt)}
              </div>
              <div style={{fontSize:12,color:C.sub,marginTop:7}}>
                Already spent, not yet paid. The figure above is cash only — net of cards you are at{" "}
                <strong style={{color:M.available-cardDebt<0?C.expense:C.text}}>
                  {M.available-cardDebt<0?"−":""}{fmt(M.available-cardDebt)}</strong>.
              </div>
            </Card>}


          {recAcct &&
            <Card style={{padding:recOpen?18:0,overflow:"hidden"}}>
              {!recOpen &&
                <button onClick={()=>setRecOpen(true)}
                  style={{width:"100%",border:"none",background:"transparent",padding:"14px 18px",
                          cursor:"pointer",display:"flex",justifyContent:"space-between",
                          alignItems:"center",gap:10}}>
                  <span style={{fontSize:13.5,fontWeight:700,color:C.text}}>Reconcile to bank</span>
                  <span style={{fontSize:12,color:C.sub}}>Balance not matching? →</span>
                </button>}

              {recOpen && <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <div style={{fontWeight:700,fontSize:14}}>Reconcile to bank</div>
                  <button onClick={()=>{setRecOpen(false);setRecVal("");}}
                    style={{border:"none",background:"transparent",color:C.sub,fontSize:13,
                            fontWeight:600,cursor:"pointer",padding:0}}>Close</button>
                </div>
                <div style={{fontSize:11.5,color:C.sub,marginBottom:14,lineHeight:1.5}}>
                  Type the balance your bank shows for {recAcct.name}. Any gap is posted as a
                  dated adjustment so the two agree.
                </div>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                             fontSize:13,marginBottom:10}}>
                  <span style={{color:C.sub}}>This app says</span>
                  <span style={{fontWeight:700}}>{M.current<0?"−":""}{fmt(M.current)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                  <span style={{fontSize:13,color:C.sub,flexShrink:0}}>Bank says</span>
                  <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" autoFocus
                    value={recVal} onChange={e=>setRecVal(e.target.value)}
                    style={{width:138,border:`1px solid ${C.accent}66`,borderRadius:8,padding:"9px 10px",
                            fontSize:16,fontWeight:700,textAlign:"right",outline:"none",background:"#fff"}}/>
                </div>

                {recDiff!==null && <>
                  <div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`,
                               display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:13,fontWeight:700}}>
                      {Math.abs(recDiff)<0.005?"Difference":recDiff>0?"Missing deposit":"Missing withdrawal"}
                    </span>
                    <span style={{fontSize:19,fontWeight:800,
                                  color:Math.abs(recDiff)<0.005?C.income:recDiff>0?C.income:C.expense}}>
                      {Math.abs(recDiff)<0.005?fmt(0):(recDiff<0?"−":"+")+fmt(recDiff)}
                    </span>
                  </div>

                  {Math.abs(recDiff)<0.005
                    ? <div style={{marginTop:11,background:"#f0fdf4",border:"1px solid #bbf7d0",
                                   borderRadius:8,padding:"10px 12px",fontSize:12.5,color:"#166534",
                                   fontWeight:600}}>
                        Balanced — nothing to adjust.
                      </div>
                    : <>
                        <Btn style={{width:"100%",marginTop:12}} onClick={postAdjustment}>
                          Post {recDiff<0?"−":"+"}{fmt(recDiff)} adjustment
                        </Btn>
                        <div style={{fontSize:11.5,color:C.sub,marginTop:9,lineHeight:1.5}}>
                          Dated today and confirmed straight away. It appears in the ledger as a normal
                          row, so you can delete it later if you find the real transaction.
                        </div>
                        {Math.abs(recDiff)>200 &&
                          <div style={{marginTop:9,background:"#fff7ed",border:"1px solid #fdba74",
                                       borderRadius:8,padding:"9px 11px",fontSize:11.5,color:"#9a3412",
                                       lineHeight:1.5}}>
                            That is a sizeable gap. Worth checking for a transaction you have not
                            entered before writing it off as an adjustment.
                          </div>}
                      </>}
                </>}
              </>}
            </Card>}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9}}>
            {[["Accounts",st.accounts.length],["Entries",visibleEntries.length],["Forecast",M.fc.length]].map(([l,v])=>(
              <Card key={l} style={{padding:12,textAlign:"center"}}>
                <div style={{fontSize:10,color:C.sub,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>{l}</div>
                <div style={{fontSize:15,fontWeight:700}}>{v}</div>
              </Card>))}
          </div>

          {[["spend","Spending by category",breakdown.spend,breakdown.spendTotal,breakdown.nSpend,"statement"],
            ["ded","Pay deductions",breakdown.ded,breakdown.dedTotal,breakdown.nDed,"pay"]]
            .filter(([,,rows])=>rows.length>0).map(([k,title,rows,total,n,noun])=>(
            <Card key={k}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
                <div style={{fontWeight:700,fontSize:14}}>{title}</div>
                <div style={{fontSize:12,fontWeight:700}}>{fmt(total)}</div>
              </div>
              <div style={{fontSize:11,color:C.sub,marginBottom:12}}>
                Across {n} confirmed {noun}{n===1?"":"s"}
              </div>
              {rows.map(([cat,amt])=>{
                const pct=total?amt/total*100:0;
                const isOther=cat.startsWith("Other");
                return (
                  <div key={cat} style={{marginBottom:9}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4,gap:8}}>
                      <span style={{color:isOther?C.sub:C.text,fontWeight:isOther?500:600,
                                    fontStyle:isOther?"italic":"normal",minWidth:0,overflow:"hidden",
                                    textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat}</span>
                      <span style={{fontWeight:700,color:C.sub,flexShrink:0}}>
                        {fmt(amt)} <span style={{fontWeight:500,fontSize:11}}>{pct.toFixed(0)}%</span></span>
                    </div>
                    <div style={{height:6,borderRadius:99,background:C.border,overflow:"hidden"}}>
                      <div style={{height:"100%",width:pct+"%",borderRadius:99,
                                   background:isOther?C.sub:(k==="ded"?"#7c3aed":C.accent),opacity:isOther?.45:1}}/>
                    </div>
                  </div>);
              })}
            </Card>))}

          <Card>
            <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Projected balance</div>
            <LineChartSVG data={line} symbol={st.symbol} color={lineColor}/>
          </Card>
          <Card>
            <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Income vs expenses</div>
            <div style={{fontSize:11,color:C.sub,marginBottom:10}}>Next 12 forecast months</div>
            <BarChartSVG data={monthly} symbol={st.symbol}/>
          </Card>
        </div>
      )}

      {/* ── ENTRIES ── */}
      {tab==="entries" && (
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:800,fontSize:21}}>Entries</div>
            {!form && <Btn onClick={()=>{setEditing(null);setForm(true);}}>+ Add</Btn>}
          </div>
          {form &&
            <EntryForm initial={editing} accounts={st.accounts}
              defaultAcct={scope} forecastYear={forecastYear}
              onSave={e=>{setSt(p=>({...p,entries:editing?p.entries.map(x=>x.id===e.id?e:x):[...p.entries,e]}));
                setForm(false);setEditing(null);}}
              onCancel={()=>{setForm(false);setEditing(null);}}/>}
          {!visibleEntries.length && !form &&
            <Card style={{textAlign:"center",padding:36,color:C.sub,fontSize:14}}>
              No entries here yet.<br/>Add your income and recurring bills to build the forecast.
            </Card>}
          {visibleEntries.map(e=>{
            const sign=(e.type==="expense"||e.type==="transfer")?-1:1;
            const col=e.type==="income"?C.income:e.type==="expense"?C.expense:C.accent;
            const a=acctById[e.accountId], to=acctById[e.toAccountId];
            return (
              <Card key={e.id} style={{padding:15}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:4}}>
                      <span style={{fontWeight:700,fontSize:15}}>{e.name}</span>
                      <Tag color={col}>{e.type}</Tag>
                      {e.split && <Tag color="#7c3aed">split</Tag>}
                    </div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:4}}>
                      {a && <Tag color={a.color}>{a.name}{a.kind==="liability"?" · card":""}</Tag>}
                      {to && <Tag color={to.color}>→ {to.name}</Tag>}
                    </div>
                    <div style={{fontSize:12,color:C.sub,marginTop:3}}>
                      {FREQ[e.frequency]}
                      {e.frequency==="monthly-date"?` · day ${e.monthlyDay}`:""}
                      {e.frequency==="monthly-dow"?` · ${NTH[e.nthWeek]} ${DAYS[e.dowIndex]}`:""}
                      {e.frequency==="custom"?` · every ${e.customInterval} ${e.customUnit}`:""}
                    </div>
                    <div style={{fontSize:11,color:C.sub,marginTop:2}}>
                      {pretty(e.startDate)} → {e.endDate?pretty(e.endDate):forecastYear}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:19,fontWeight:800,color:col}}>
                      {sign<0?"−":"+"}{fmt(parseFloat(e.amount)||0)}</div>
                    <div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:9}}>
                      <Btn v="ghost" style={{padding:"6px 12px",fontSize:13}}
                        onClick={()=>{setEditing(e);setForm(true);}}>Edit</Btn>
                      <Btn v="danger" style={{padding:"6px 12px",fontSize:13}}
                        onClick={()=>{if(confirm(`Delete "${e.name}"?`))
                          setSt(p=>({...p,entries:p.entries.filter(x=>x.id!==e.id)}));}}>Del</Btn>
                    </div>
                  </div>
                </div>
              </Card>);
          })}
        </div>
      )}

      {/* ── LEDGER ── */}
      {tab==="ledger" && (
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          <div style={{fontWeight:800,fontSize:21}}>Ledger</div>
          <Scoper/>
          <div style={{fontSize:12.5,color:C.sub,marginBottom:2,lineHeight:1.5}}>
            Tick <strong>Cleared</strong> when a transaction appears in your bank, then type the amount that
            actually went through — even when it matches the forecast. A row only counts once you confirm it.
          </div>

          {M.nAwaiting>0 &&
            <div style={{background:"#fff7ed",border:"1px solid #fdba74",borderRadius:11,
                         padding:"11px 13px",display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:15,lineHeight:1.2}}>⚠</span>
              <div style={{fontSize:12.5,color:"#9a3412",lineHeight:1.5}}>
                <strong>{M.nAwaiting} transaction{M.nAwaiting===1?"":"s"} awaiting an amount.</strong>{" "}
                They stay in the forecast and are not in your current balance until confirmed.
              </div>
            </div>}

          {!M.occ.length &&
            <Card style={{textAlign:"center",padding:36,color:C.sub,fontSize:14}}>Add entries first</Card>}

          {postedRows.length>0 &&
            <button onClick={()=>setPostedOpen(o=>!o)}
              style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",
                      background:"transparent",border:"none",cursor:"pointer",padding:"8px 0 0",
                      textAlign:"left"}}>
              <span style={{fontSize:11,fontWeight:800,color:C.income,textTransform:"uppercase",
                            letterSpacing:".07em"}}>
                Posted · balance {fmt(M.current)}
              </span>
              <span style={{fontSize:11,fontWeight:700,color:C.sub}}>
                {postedOpen?"Hide ▲":`Show ${postedRows.length} ▼`}
              </span>
            </button>}
          {postedOpen &&
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                         background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,
                         padding:"10px 6px"}}>
              <span style={{fontSize:13,fontWeight:700,color:C.sub}}>Opening balance</span>
              <span style={{fontSize:15,fontWeight:800,color:C.text}}>
                {(+scopeAcct?.opening||0)<0?"−":""}{fmt(+scopeAcct?.opening||0)}
              </span>
            </div>}
          {postedOpen && postedRows.map(o=>{const a=acctById[o.accountId];
            return <Row key={o.key} o={o} fmt={fmt} setSt={setSt} runBal={o.runBal}
              acctName={null} acctColor={a?.color}/>;})}

          {fcShown.map(p=>{const a=acctById[p.accountId];
            return <Row key={p.key} o={p} fmt={fmt} setSt={setSt} runBal={p.runBal} avail={p.avail}
              isLow={p.date===M.lowDate&&p.runBal===M.available}
              acctName={null} acctColor={a?.color}/>;})}
          {M.fc.length>60 &&
            <Btn v="ghost" style={{marginTop:6}} onClick={()=>setShowAll(s=>!s)}>
              {showAll?"Show less":`Show all ${M.fc.length} forecast rows`}</Btn>}
        </div>
      )}


      {/* ── BUDGET ── */}
      {tab==="budget" && (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:800,fontSize:21}}>Budget</div>
            <Btn onClick={()=>{setEditSpend(null);setSpendOpen(true);}}>+ Log spend</Btn>
          </div>

          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button onClick={()=>setBudgetMonth(m=>addMonthKey(m,-1))}
              style={{width:44,height:40,border:`1px solid ${C.border}`,borderRadius:9,
                background:C.card,fontSize:18,cursor:"pointer",flexShrink:0}}>‹</button>
            <div style={{flex:1,textAlign:"center",fontWeight:800,fontSize:15}}>
              {prettyMonth(budgetMonth)}</div>
            <button onClick={()=>setBudgetMonth(m=>addMonthKey(m,1))}
              style={{width:44,height:40,border:`1px solid ${C.border}`,borderRadius:9,
                background:C.card,fontSize:18,cursor:"pointer",flexShrink:0}}>›</button>
          </div>

          <Card style={{padding:"12px 13px",background:"#f4f6fb",borderColor:"#dbe3f5"}}>
            <div style={{fontSize:10,fontWeight:700,color:C.sub,textTransform:"uppercase",
                         letterSpacing:".05em",marginBottom:5}}>All categories</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
              <span style={{fontSize:12,color:C.sub,fontWeight:600}}>
                {fmt(budgetTotals.spent)} spent
                {budgetTotals.planned>0?` · ${fmt(budgetTotals.planned)} still due`:""}
                {" · of "+fmt(budgetTotals.budget)}</span>
              <span style={{fontSize:17,fontWeight:800,
                            color:budgetTotals.left<0?C.expense:C.text}}>
                {budgetTotals.left<0?"−":""}{fmt(budgetTotals.left)}
                <span style={{fontSize:10.5,fontWeight:600,color:C.sub}}> left</span></span>
            </div>
          </Card>

          {BUDGET_CATS.map(cat=>{
            const b=budgetByCat[cat]||{cat,budget:0,spent:0,carry:0,scheduled:0,left:0,free:0};
            return <BudgetRow key={cat} b={b} fmt={fmt}
              onTap={setBudgetEdit} onReset={resetCarry}/>;
          })}

          {monthSpends.length>0 &&
            <Card style={{padding:"12px 13px"}}>
              <button onClick={()=>setSpendListOpen(o=>!o)}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",
                        background:"transparent",border:"none",padding:0,cursor:"pointer"}}>
                <span style={{fontWeight:700,fontSize:14}}>
                  Logged this month · {monthSpends.length}</span>
                <span style={{fontSize:11.5,fontWeight:700,color:C.sub}}>
                  {spendListOpen?"Hide ▲":"Show ▼"}</span>
              </button>
              {spendListOpen && monthSpends.map(sp=>{const a=acctById[sp.accountId];
                return (
                  <div key={sp.id} onClick={()=>{setEditSpend(sp);setSpendOpen(true);}}
                    style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,
                            padding:"9px 0",borderTop:`1px solid ${C.border}`,cursor:"pointer"}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,overflow:"hidden",
                                   textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {sp.note||sp.category}</div>
                      <div style={{fontSize:11,color:C.sub,marginTop:1}}>
                        {pretty(sp.date)} · {sp.category} · {a?.name||"—"}</div>
                    </div>
                    <div style={{fontSize:14,fontWeight:700,flexShrink:0}}>{fmt(sp.amount)}</div>
                  </div>);})}
            </Card>}
        </div>
      )}

      {/* ── YEAR ── */}
      {tab==="year" && (
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{fontWeight:800,fontSize:21}}>Annual summary</div>
          <Scoper/>

          <div style={{display:"flex",gap:8,alignItems:"stretch"}}>
            <button onClick={()=>{const i=years.indexOf(year); if(i>0)setYear(years[i-1]);}}
              disabled={years.indexOf(year)<=0}
              style={{width:46,flexShrink:0,border:`1px solid ${C.border}`,borderRadius:9,cursor:"pointer",
                background:C.card,fontSize:19,color:years.indexOf(year)<=0?C.border:C.text,
                opacity:years.indexOf(year)<=0?.5:1}}>‹</button>
            <Sel value={year} onChange={v=>setYear(v.target.value)}
              style={{fontWeight:700,textAlign:"center",textAlignLast:"center"}}>
              {years.map(y=><option key={y} value={y}>{y}</option>)}
            </Sel>
            <button onClick={()=>{const i=years.indexOf(year); if(i<years.length-1)setYear(years[i+1]);}}
              disabled={years.indexOf(year)>=years.length-1}
              style={{width:46,flexShrink:0,border:`1px solid ${C.border}`,borderRadius:9,cursor:"pointer",
                background:C.card,fontSize:19,color:years.indexOf(year)>=years.length-1?C.border:C.text,
                opacity:years.indexOf(year)>=years.length-1?.5:1}}>›</button>
          </div>

          <div style={{display:"flex",gap:0,border:`1px solid ${C.border}`,borderRadius:9,overflow:"hidden"}}>
            {[["all","Actual + forecast"],["confirmed","Confirmed only"]].map(([k,l])=>(
              <button key={k} onClick={()=>setYearMode(k)}
                style={{flex:1,padding:"9px 6px",border:"none",cursor:"pointer",fontSize:12.5,fontWeight:700,
                  background:yearMode===k?C.accent:C.card,color:yearMode===k?"#fff":C.sub}}>{l}</button>))}
          </div>

          {!annual.count &&
            <Card style={{textAlign:"center",padding:36,color:C.sub,fontSize:14}}>
              Nothing recorded in {year}{yearMode==="confirmed"?" yet — no confirmed rows":""}.
            </Card>}

          {annual.count>0 && <>
            <Card style={{borderTop:`3px solid ${annual.net<0?C.expense:C.income}`}}>
              <Lab>{annual.net<0?"Shortfall":"Net surplus"} · {year}</Lab>
              <div style={{fontSize:36,fontWeight:800,letterSpacing:"-.035em",lineHeight:1.05,marginTop:3,
                           color:annual.net<0?C.expense:C.income}}>
                {annual.net<0?"−":""}{fmt(annual.net)}
              </div>
              <div style={{fontSize:12,color:C.sub,marginTop:7}}>
                {yearMode==="confirmed"
                  ? `From ${annual.nConfirmed} confirmed transaction${annual.nConfirmed===1?"":"s"}`
                  : `${annual.nConfirmed} confirmed, ${annual.count-annual.nConfirmed} still forecast`}
              </div>
              <div style={{display:"flex",gap:10,marginTop:14,paddingTop:13,borderTop:`1px solid ${C.border}`}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:10.5,color:C.sub,textTransform:"uppercase",letterSpacing:".05em"}}>Money in</div>
                  <div style={{fontSize:17,fontWeight:800,color:C.income,marginTop:3}}>{fmt(annual.inc)}</div>
                </div>
                <div style={{width:1,background:C.border}}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:10.5,color:C.sub,textTransform:"uppercase",letterSpacing:".05em"}}>Money out</div>
                  <div style={{fontSize:17,fontWeight:800,color:C.expense,marginTop:3}}>{fmt(annual.exp)}</div>
                </div>
                <div style={{width:1,background:C.border}}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:10.5,color:C.sub,textTransform:"uppercase",letterSpacing:".05em"}}>Saved</div>
                  <div style={{fontSize:17,fontWeight:800,marginTop:3,color:annual.inc?
                    (annual.net<0?C.expense:C.text):C.sub}}>
                    {annual.inc?((annual.net/annual.inc)*100).toFixed(0)+"%":"—"}</div>
                </div>
              </div>
            </Card>

            <Card>
              <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Month by month</div>
              <BarChartSVG data={annual.months} symbol={st.symbol}/>
            </Card>

            {[["out","Where it went",annual.outCat,annual.exp,C.expense],
              ["in","Where it came from",annual.inCat,annual.inc,C.income]]
              .filter(([,,rows])=>rows.length>0).map(([k,title,rows,total,col])=>(
              <Card key={k}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:12}}>
                  <div style={{fontWeight:700,fontSize:14}}>{title}</div>
                  <div style={{fontSize:12,fontWeight:700,color:col}}>{fmt(total)}</div>
                </div>
                {rows.map(([cat,amt])=>{
                  const pct=total?amt/total*100:0;
                  return (
                    <div key={cat} style={{marginBottom:9}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4,gap:8}}>
                        <span style={{fontWeight:600,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",
                                      whiteSpace:"nowrap"}}>{cat}</span>
                        <span style={{fontWeight:700,color:C.sub,flexShrink:0}}>
                          {fmt(amt)} <span style={{fontWeight:500,fontSize:11}}>{pct.toFixed(0)}%</span></span>
                      </div>
                      <div style={{height:6,borderRadius:99,background:C.border,overflow:"hidden"}}>
                        <div style={{height:"100%",width:pct+"%",borderRadius:99,background:col,opacity:.75}}/>
                      </div>
                    </div>);
                })}
              </Card>))}

            {annual.spend.length>0 &&
              <Card>
                <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>Itemised spending</div>
                <div style={{fontSize:11,color:C.sub,marginBottom:12}}>
                  Drilled out of your split statements — already counted above
                </div>
                {annual.spend.map(([cat,amt])=>{
                  const tot=annual.spend.reduce((s,[,v])=>s+v,0);
                  const pct=tot?amt/tot*100:0, isOther=cat==="Other";
                  return (
                    <div key={cat} style={{marginBottom:9}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4,gap:8}}>
                        <span style={{fontWeight:isOther?500:600,color:isOther?C.sub:C.text,
                                      fontStyle:isOther?"italic":"normal",minWidth:0,overflow:"hidden",
                                      textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat}</span>
                        <span style={{fontWeight:700,color:C.sub,flexShrink:0}}>
                          {fmt(amt)} <span style={{fontWeight:500,fontSize:11}}>{pct.toFixed(0)}%</span></span>
                      </div>
                      <div style={{height:6,borderRadius:99,background:C.border,overflow:"hidden"}}>
                        <div style={{height:"100%",width:pct+"%",borderRadius:99,
                                     background:C.accent,opacity:isOther?.4:1}}/>
                      </div>
                    </div>);
                })}
              </Card>}

            {annual.gross>0 &&
              <Card>
                <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>Pay: gross to net</div>
                <div style={{fontSize:11,color:C.sub,marginBottom:13}}>
                  Across {annual.nPay} confirmed pay{annual.nPay===1?"":"s"} in {year}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",
                             paddingBottom:9,marginBottom:10,borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:13,fontWeight:700}}>Gross earnings</span>
                  <span style={{fontSize:18,fontWeight:800}}>{fmt(annual.gross)}</span>
                </div>
                {annual.ded.map(([cat,amt])=>{
                  const pct=annual.gross?amt/annual.gross*100:0, isOther=cat.startsWith("Other");
                  return (
                    <div key={cat} style={{marginBottom:9}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4,gap:8}}>
                        <span style={{color:isOther?C.sub:C.text,fontWeight:isOther?500:600,
                                      fontStyle:isOther?"italic":"normal",minWidth:0,overflow:"hidden",
                                      textOverflow:"ellipsis",whiteSpace:"nowrap"}}>− {cat}</span>
                        <span style={{fontWeight:700,color:C.sub,flexShrink:0}}>
                          {fmt(amt)} <span style={{fontWeight:500,fontSize:11}}>{pct.toFixed(1)}%</span></span>
                      </div>
                      <div style={{height:6,borderRadius:99,background:C.border,overflow:"hidden"}}>
                        <div style={{height:"100%",width:pct+"%",borderRadius:99,
                                     background:"#7c3aed",opacity:isOther?.4:1}}/>
                      </div>
                    </div>);
                })}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",
                             paddingTop:10,marginTop:4,borderTop:`2px solid ${C.text}`}}>
                  <span style={{fontSize:13,fontWeight:700}}>Net deposited</span>
                  <span style={{fontSize:18,fontWeight:800,color:C.income}}>{fmt(annual.netPay)}</span>
                </div>
                <div style={{fontSize:11.5,color:C.sub,marginTop:7}}>
                  {((1-annual.netPay/annual.gross)*100).toFixed(1)}% of gross withheld
                </div>
              </Card>}
          </>}
        </div>
      )}

      {/* ── SETUP ── */}
      {tab==="setup" && (
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{fontWeight:800,fontSize:21}}>Setup</div>

          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:13}}>
              <div style={{fontWeight:700,fontSize:15}}>Accounts</div>
              {!acctForm && <Btn style={{padding:"8px 14px",fontSize:14}}
                onClick={()=>setAcctForm({...newAccount("",0),color:ACCT_COLORS[st.accounts.length%ACCT_COLORS.length],_new:true})}>
                + Account</Btn>}
            </div>
            {acctForm &&
              <div style={{border:`1px solid ${C.border}`,borderRadius:11,padding:14,marginBottom:13,
                           display:"flex",flexDirection:"column",gap:12}}>
                <div><Lab>Account name</Lab>
                  <Inp placeholder="Royal Bank Chequing" value={acctForm.name}
                    onChange={e=>setAcctForm(p=>({...p,name:e.target.value}))}/></div>
                <div><Lab>Account type</Lab>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {[["asset","Cash / chequing"],["liability","Credit card"]].map(([k,label])=>(
                      <button key={k} onClick={()=>setAcctForm(p=>({...p,kind:k}))}
                        style={{padding:"12px 6px",borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:700,
                          border:`2px solid ${acctForm.kind===k?C.accent:C.border}`,
                          background:acctForm.kind===k?C.accent+"12":"#fff",
                          color:acctForm.kind===k?C.accent:C.text}}>{label}</button>))}
                  </div></div>
                <div><Lab>{acctForm.kind==="liability"?"Balance owing now":"Opening balance"}</Lab>
                  <Inp type="number" inputMode="decimal" step="0.01" value={acctForm.opening}
                    onChange={e=>setAcctForm(p=>({...p,opening:e.target.value===""?0:parseFloat(e.target.value)}))}/></div>

                {acctForm.kind==="liability" && <>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                    <div><Lab>Closes</Lab>
                      <Inp type="number" inputMode="numeric" min="1" max="31"
                        value={acctForm.closeDay??""}
                        onChange={e=>setAcctForm(p=>({...p,closeDay:e.target.value===""?"":parseInt(e.target.value,10)}))}
                        onBlur={e=>{const n=parseInt(e.target.value,10);
                          setAcctForm(p=>({...p,closeDay:isNaN(n)?20:Math.min(31,Math.max(1,n))}));}}/></div>
                    <div><Lab>Due</Lab>
                      <Inp type="number" inputMode="numeric" min="1" max="31"
                        value={acctForm.dueDay??""}
                        onChange={e=>setAcctForm(p=>({...p,dueDay:e.target.value===""?"":parseInt(e.target.value,10)}))}
                        onBlur={e=>{const n=parseInt(e.target.value,10);
                          setAcctForm(p=>({...p,dueDay:isNaN(n)?15:Math.min(31,Math.max(1,n))}));}}/></div>
                    <div><Lab>You pay</Lab>
                      <Inp type="number" inputMode="numeric" min="1" max="31"
                        value={acctForm.payDay??""}
                        onChange={e=>setAcctForm(p=>({...p,payDay:e.target.value===""?"":parseInt(e.target.value,10)}))}
                        onBlur={e=>{const n=parseInt(e.target.value,10);
                          setAcctForm(p=>({...p,payDay:isNaN(n)?(acctForm.dueDay||15):Math.min(31,Math.max(1,n))}));}}/></div>
                  </div>
                  <div style={{fontSize:11.5,color:C.sub,marginTop:-4,lineHeight:1.5}}>
                    Statement closes, payment is due, and the day you actually pay it. The
                    payment shows on the cash account below as a payable for that cycle.
                  </div>
                  <div><Lab>Paid from</Lab>
                    <Sel value={acctForm.payFrom||""}
                      onChange={e=>setAcctForm(p=>({...p,payFrom:e.target.value}))}>
                      <option value="">First cash account</option>
                      {st.accounts.filter(a=>a.kind!=="liability").map(a=>
                        <option key={a.id} value={a.id}>{a.name}</option>)}
                    </Sel></div>
                  <div><Lab>Each month you pay</Lab>
                    <Sel value={acctForm.payRule||"full"}
                      onChange={e=>setAcctForm(p=>({...p,payRule:e.target.value}))}>
                      <option value="full">The full statement balance</option>
                      <option value="minimum">The minimum (about 3%)</option>
                      <option value="fixed">A fixed amount</option>
                    </Sel></div>
                  {acctForm.payRule==="fixed" &&
                    <div><Lab>Fixed payment</Lab>
                      <Inp type="number" inputMode="decimal" step="0.01" placeholder="0.00"
                        value={acctForm.payFixed||""}
                        onChange={e=>setAcctForm(p=>({...p,payFixed:e.target.value}))}/></div>}
                  <div style={{fontSize:11.5,color:C.sub,lineHeight:1.5}}>
                    Spends logged to this card land in the statement that captures their date.
                    The payment on your cash account is worked out from that cycle — never typed.
                  </div>
                </>}

                <div><Lab>Colour</Lab>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {ACCT_COLORS.map(c=>(
                      <button key={c} onClick={()=>setAcctForm(p=>({...p,color:c}))}
                        style={{width:32,height:32,borderRadius:99,background:c,cursor:"pointer",
                          border:acctForm.color===c?`3px solid ${C.text}`:"3px solid transparent"}}/>))}
                  </div></div>
                <div style={{display:"flex",gap:9,justifyContent:"flex-end"}}>
                  <Btn v="ghost" onClick={()=>setAcctForm(null)}>Cancel</Btn>
                  <Btn style={{opacity:acctForm.name.trim()?1:.4}} onClick={()=>{
                    if(!acctForm.name.trim())return;
                    const {_new,...a}=acctForm;
                    setSt(p=>({...p,accounts:_new?[...p.accounts,a]:p.accounts.map(x=>x.id===a.id?a:x)}));
                    setAcctForm(null);
                  }}>Save</Btn>
                </div>
              </div>}
            <div style={{display:"flex",flexDirection:"column",gap:9}}>
              {st.accounts.map(acct=>{
                const p=perAccount.find(x=>x.account.id===acct.id);
                const isCard=acct.kind==="liability";
                const owing=isCard?(cardCycles[acct.id]||[]).reduce((t,cy)=>{
                  const key="card|"+acct.id+"|"+cy.closeKey;
                  return t+(st.actuals[key]!==undefined?0:cy.total);},0):0;
                return (
                <div key={acct.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  gap:10,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 13px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                    <div style={{width:10,height:10,borderRadius:99,background:acct.color,flexShrink:0}}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:14.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {acct.name}{isCard?" · card":""}</div>
                      <div style={{fontSize:11.5,color:C.sub,marginTop:2}}>
                        {isCard
                          ? `Owing ${fmt(owing)} · closes ${acct.closeDay}, due ${acct.dueDay}`
                          : `Opening ${fmt(acct.opening)} · now ${fmt(p?p.current:0)}`}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <Btn v="ghost" style={{padding:"6px 11px",fontSize:13}}
                      onClick={()=>setAcctForm({...acct})}>Edit</Btn>
                    {st.accounts.length>1 &&
                      <Btn v="danger" style={{padding:"6px 11px",fontSize:13}} onClick={()=>{
                        const n=st.entries.filter(e=>e.accountId===acct.id).length;
                        const nsp=st.spends.filter(x=>x.accountId===acct.id).length;
                        const extra=[n?`${n} entr${n===1?"y":"ies"}`:"",nsp?`${nsp} logged spend${nsp===1?"":"s"}`:""]
                          .filter(Boolean).join(" and ");
                        if(confirm(`Delete "${acct.name}"?${extra?`\n\n${extra} will be deleted too.`:""}`)){
                          setSt(s=>({...s,accounts:s.accounts.filter(a=>a.id!==acct.id),
                            entries:s.entries.filter(e=>e.accountId!==acct.id)
                              .map(e=>e.toAccountId===acct.id?{...e,toAccountId:""}:e),
                            spends:s.spends.filter(x=>x.accountId!==acct.id)}));
                          if(scope===acct.id)setScope(st.accounts.find(a=>a.id!==acct.id&&a.kind!=="liability")?.id||"");
                        }}}>Del</Btn>}
                  </div>
                </div>);})}
            </div>
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Backup &amp; restore</div>
            <div style={{fontSize:12,color:C.sub,lineHeight:1.55,marginBottom:12}}>
              Your data is stored by the browser against this exact page. Open a newer copy of
              Ledgerwise and it starts empty — nothing is lost, the new copy just cannot see the
              old one. Copy your backup before switching, then paste it into the new copy.
            </div>

            <Btn style={{width:"100%",marginBottom:8}} onClick={async()=>{
              const text=JSON.stringify(st);
              try{
                await navigator.clipboard.writeText(text);
                setBackupMsg("Backup copied. Paste it somewhere safe — Notes, email to yourself, anywhere.");
              }catch{
                setRestoreText(text);
                setBackupMsg("Could not reach the clipboard. Your backup is in the box below — select all and copy it.");
              }
            }}>Copy my backup</Btn>

            <Btn v="ghost" style={{width:"100%",marginBottom:12}} onClick={()=>{
              const blob=new Blob([JSON.stringify(st,null,2)],{type:"application/json"});
              const a=document.createElement("a");
              a.href=URL.createObjectURL(blob);
              a.download=`ledgerwise-${ymd(new Date())}.json`;a.click();
              setBackupMsg("Saved as a file. Keep it in Files or iCloud Drive.");
            }}>Save backup as a file</Btn>

            <Lab>Restore from a backup</Lab>
            <textarea value={restoreText} onChange={e=>setRestoreText(e.target.value)}
              placeholder="Paste your backup here…"
              style={{width:"100%",minHeight:78,border:`1px solid ${C.border}`,borderRadius:9,
                      padding:"10px 11px",fontSize:13,fontFamily:"inherit",color:C.text,
                      background:"#fff",outline:"none",boxSizing:"border-box",resize:"vertical"}}/>
            <Btn v="ghost" style={{width:"100%",marginTop:8,opacity:restoreText.trim()?1:.4}}
              onClick={()=>{
                const raw=restoreText.trim(); if(!raw)return;
                let data; try{ data=JSON.parse(raw); }
                catch{ setBackupMsg("That does not look like a Ledgerwise backup — check you pasted all of it."); return; }
                if(!data||typeof data!=="object"||!Array.isArray(data.accounts)){
                  setBackupMsg("That JSON is not a Ledgerwise backup."); return; }
                const n=(data.entries||[]).length, sp=(data.spends||[]).length;
                if(!confirm(`Restore ${data.accounts.length} account(s), ${n} entr${n===1?"y":"ies"} and ${sp} logged spend${sp===1?"":"s"}?\n\nThis replaces what is in this copy now.`))return;
                setSt(migrate(data)); setRestoreText(""); setBackupMsg("Restored.");
              }}>Restore</Btn>
            {backupMsg &&
              <div style={{fontSize:12,color:C.accent,marginTop:10,lineHeight:1.5,fontWeight:600}}>
                {backupMsg}</div>}
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,marginBottom:8}}>How the two balances work</div>
            <div style={{fontSize:13,color:C.sub,lineHeight:1.65}}>
              <strong style={{color:C.text}}>Current balance</strong> is the opening balance plus every
              transaction you have confirmed. Ticking Cleared is not enough on its own — you must type the
              amount that actually went through, even when it matches the forecast. Once confirmed, that row
              is locked: editing the entry later will never rewrite it.
              <br/><br/>
              <strong style={{color:C.text}}>Available to spend</strong> is the lowest point the running balance
              reaches anywhere in the remaining forecast. You may hold {fmt(M.current)} today, but if the balance
              dips to {fmt(M.available)} before the next paycheque lands, that dip is what you can truly spend.
              <br/><br/>
              Each account is forecast on its own — switch between them with the selector above,
              and internal transfers still show on both sides individually.
            </div>
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Data</div>
            <div style={{display:"flex",flexDirection:"column",gap:9}}>
              <Btn onClick={()=>{
                if(typeof XLSX==="undefined"){alert("Excel library still loading — try again in a moment.");return;}
                try{
                  const wb=buildWorkbook(st,perAccount,combined,combinedOpening,acctById,forecastYear);
                  XLSX.writeFile(wb,`ledgerwise-${ymd(new Date())}.xlsx`);
                }catch(err){alert("Export failed: "+err.message);}
              }}>Export to Excel</Btn>
              <div style={{fontSize:11.5,color:C.sub,lineHeight:1.55,marginTop:-2,marginBottom:4}}>
                One tab per account with live formulas, plus a summary and your list of rules.
                Opens in Excel, Numbers or Google Sheets — good for printing or handing to an accountant.
              </div>
              <Btn v="danger" onClick={()=>{if(confirm("Erase everything? This cannot be undone."))setSt(DEFAULTS);}}>
                Reset all data</Btn>
            </div>
          </Card>
        </div>
      )}
      </div>

      {budgetEdit &&
        <BudgetSheet row={budgetEdit} fmt={fmt}
          onSave={(cat,val)=>{commitBudget(cat,val);setBudgetEdit(null);}}
          onCancel={()=>setBudgetEdit(null)}/>}

      {spendOpen &&
        <SpendSheet initial={editSpend} accounts={st.accounts}
          defaultAcct={editSpend?editSpend.accountId:(st.accounts[0]?.id||"")}
          onSave={sp=>{setSt(p=>({...p,spends:editSpend
            ?p.spends.map(x=>x.id===sp.id?sp:x):[...p.spends,sp]}));
            setSpendOpen(false);setEditSpend(null);}}
          onCancel={()=>{setSpendOpen(false);setEditSpend(null);}}/>}

      <div style={{position:"fixed",left:0,right:0,bottom:0,background:C.card,borderTop:`1px solid ${C.border}`,
                   display:"flex",zIndex:60,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {TABS.map(([k,label,icon])=>(
          <button key={k} onClick={()=>setTab(k)}
            style={{flex:1,border:"none",background:"transparent",padding:"9px 4px 7px",display:"flex",
                    flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",
                    borderTop:`2px solid ${tab===k?C.accent:"transparent"}`}}>
            <span style={{fontSize:17,color:tab===k?C.accent:C.sub}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:700,color:tab===k?C.accent:C.sub}}>{label}</span>
          </button>))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
