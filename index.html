const { useState, useEffect, useMemo, useCallback } = React;

const KEY="ledgerwise_v2";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||null;}catch{return null;}};
const save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}};

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x;};
const addYears=(d,n)=>{const x=new Date(d);x.setFullYear(x.getFullYear()+n);return x;};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pretty=s=>{const d=parseDate(s);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function nthDow(y,m,dow,nth){
  if(nth===-1){let d=new Date(y,m+1,0);while(d.getDay()!==dow)d.setDate(d.getDate()-1);return d;}
  let d=new Date(y,m,1);while(d.getDay()!==dow)d.setDate(d.getDate()+1);
  d.setDate(d.getDate()+(nth-1)*7);return d;
}

function occurrences(e,end){
  const start=parseDate(e.startDate);
  const stop=e.endDate?parseDate(e.endDate):end;
  const cap=stop<end?stop:end;
  const out=[],G=6000;
  if(e.frequency==="once"){if(start<=cap)out.push(ymd(start));return out;}
  let cur=new Date(start);
  if(e.frequency==="weekly"){while(cur<=cap&&out.length<G){out.push(ymd(cur));cur=addDays(cur,7);}}
  else if(e.frequency==="biweekly"){while(cur<=cap&&out.length<G){out.push(ymd(cur));cur=addDays(cur,14);}}
  else if(e.frequency==="monthly-date"){
    const day=e.monthlyDay||start.getDate();
    let y=start.getFullYear(),m=start.getMonth();
    while(out.length<G){
      const dim=new Date(y,m+1,0).getDate();
      const d=new Date(y,m,Math.min(day,dim));
      if(d>cap)break; if(d>=start)out.push(ymd(d));
      m++; if(m>11){m=0;y++;}
    }
  }
  else if(e.frequency==="monthly-dow"){
    let y=start.getFullYear(),m=start.getMonth();
    while(out.length<G){
      const d=nthDow(y,m,e.dowIndex,e.nthWeek);
      if(d>cap)break; if(d>=start)out.push(ymd(d));
      m++; if(m>11){m=0;y++;}
    }
  }
  else if(e.frequency==="annually"){while(cur<=cap&&out.length<G){out.push(ymd(cur));cur=addYears(cur,1);}}
  else if(e.frequency==="custom"){
    const n=e.customInterval||1,u=e.customUnit||"months";
    while(cur<=cap&&out.length<G){out.push(ymd(cur));
      cur=u==="days"?addDays(cur,n):u==="weeks"?addDays(cur,n*7):addMonths(cur,n);}
  }
  return out;
}

const ACCT_COLORS=["#2563eb","#0891b2","#7c3aed","#c2410c","#0d9488","#be123c"];

// ── Month + billing cycle helpers ────────────────────────────────────
const monthKey=d=>(typeof d==="string"?d:ymd(d)).slice(0,7);
const clampDay=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
function addMonthKey(mk,n){const [y,m]=mk.split("-").map(Number);
  const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function prettyMonth(mk){const [y,m]=mk.split("-").map(Number);return MON[m-1]+" "+y;}

// A card's statement closes on closeDay. A spend dated after the close
// belongs to the NEXT statement. Returns the close date that captures it.
function cycleCloseFor(dateStr,closeDay){
  const d=parseDate(dateStr);
  let y=d.getFullYear(),m=d.getMonth();
  let close=clampDay(y,m,closeDay);
  if(d>close){m++; if(m>11){m=0;y++;} close=clampDay(y,m,closeDay);}
  return close;
}
// Payment is due on dueDay. If dueDay <= closeDay the due date falls in the
// month after the close, otherwise it is the same month.
function dueDateFor(close,closeDay,dueDay){
  let y=close.getFullYear(),m=close.getMonth();
  if(dueDay<=closeDay){m++; if(m>11){m=0;y++;}}
  return clampDay(y,m,dueDay);
}

const newAccount=(name,bal)=>({id:uid(),name:name||"Chequing",opening:bal||0,color:ACCT_COLORS[0],
  kind:"asset",closeDay:20,dueDay:15,payDay:15,payRule:"full",payFixed:""});

const DEFAULTS={currency:"CAD",symbol:"$",forecastYear:new Date().getFullYear()+16,
  accounts:[newAccount("Chequing",0)],entries:[],cleared:{},actuals:{},splits:{},grosses:{},grossSplits:{},
  spends:[],budgets:{},budgetResets:[]};

// Migrate v1 single-account data
function migrate(raw){
  if(!raw) return DEFAULTS;
  const s={...DEFAULTS,...raw};
  if(!Array.isArray(s.accounts)||!s.accounts.length){
    const a=newAccount("Chequing",raw.openingBalance||0);
    s.accounts=[a];
    s.entries=(s.entries||[]).map(e=>({...e,accountId:e.accountId||a.id}));
  }
  // every account carries a kind; older data predates liabilities
  s.accounts=s.accounts.map(a=>({kind:"asset",closeDay:20,dueDay:15,payRule:"full",payFixed:"",...a,
    payDay:a.payDay??a.dueDay??15}));
  if(!Array.isArray(s.spends)) s.spends=[];
  if(!s.budgets||typeof s.budgets!=="object") s.budgets={};
  if(!Array.isArray(s.budgetResets)) s.budgetResets=[];
  const ids=new Set(s.accounts.map(a=>a.id));
  s.entries=(s.entries||[]).map(e=>{
    let x=ids.has(e.accountId)?e:{...e,accountId:s.accounts[0].id};
    if(x.type==="card") x={...x,type:"expense",split:true,
      trackedCats:x.trackedCats&&x.trackedCats.length?x.trackedCats:["Groceries","Fuel"]};
    return x;});
  s.spends=s.spends.filter(sp=>ids.has(sp.accountId)
    && typeof sp.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(sp.date));
  delete s.openingBalance;
  return s;
}

const C={bg:"#f9f8f6",card:"#fff",border:"#e8e5e0",text:"#1a1a1a",sub:"#6b6860",
  accent:"#2563eb",income:"#16a34a",expense:"#dc2626",warn:"#b45309",dark:"#374151"};

const Card=({children,style})=>(<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:18,...style}}>{children}</div>);
const Lab=({children})=>(<div style={{fontSize:11,fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",color:C.sub,marginBottom:6}}>{children}</div>);
const Inp=({style,...p})=>(<input {...p} style={{width:"100%",padding:"11px 12px",border:`1px solid ${C.border}`,borderRadius:9,fontSize:16,background:"#fff",color:C.text,outline:"none",...style}}/>);
const Sel=({children,style,...p})=>(<select {...p} style={{width:"100%",padding:"11px 12px",border:`1px solid ${C.border}`,borderRadius:9,fontSize:16,background:"#fff",color:C.text,outline:"none",...style}}>{children}</select>);
const Btn=({children,onClick,v="primary",style})=>{
  const vs={primary:{background:C.accent,color:"#fff"},ghost:{background:"transparent",color:C.sub,border:`1px solid ${C.border}`},danger:{background:"#fee2e2",color:C.expense}};
  return <button onClick={onClick} style={{padding:"11px 18px",borderRadius:9,fontSize:15,fontWeight:600,border:"none",cursor:"pointer",touchAction:"manipulation",...vs[v],...style}}>{children}</button>;
};
const Tag=({children,color})=>(<span style={{fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:99,background:color+"1a",color,whiteSpace:"nowrap"}}>{children}</span>);

// ── Charts ───────────────────────────────────────────────────────────
function LineChartSVG({data,symbol,color}){
  if(data.length<2) return <div style={{color:C.sub,fontSize:13,padding:"22px 0",textAlign:"center"}}>Not enough data yet</div>;
  const W=320,H=150,P={t:8,r:6,b:20,l:44},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const vals=data.map(d=>d.balance);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(lo===hi){lo-=1;hi+=1;}
  const pd=(hi-lo)*0.1; lo-=pd; hi+=pd;
  const x=i=>P.l+(i/(data.length-1))*iw, y=v=>P.t+ih-((v-lo)/(hi-lo))*ih;
  const path=data.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.balance).toFixed(1)}`).join("");
  const area=path+`L${x(data.length-1).toFixed(1)},${(P.t+ih).toFixed(1)}L${P.l},${(P.t+ih).toFixed(1)}Z`;
  const zy=lo<0&&hi>0?y(0):null;
  const kf=v=>Math.abs(v)>=1000?`${symbol}${(v/1000).toFixed(1)}k`:`${symbol}${v.toFixed(0)}`;
  const li=[0,Math.floor((data.length-1)/2),data.length-1];
  return (<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
    {[hi,(hi+lo)/2,lo].map((t,i)=>(<g key={i}>
      <line x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)} stroke={C.border} strokeDasharray="3 3"/>
      <text x={P.l-6} y={y(t)+3.5} textAnchor="end" fontSize="9" fill={C.sub}>{kf(t)}</text></g>))}
    {zy!==null && <line x1={P.l} x2={W-P.r} y1={zy} y2={zy} stroke={C.expense}/>}
    <path d={area} fill={color} opacity="0.08"/>
    <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
    {li.map(i=><text key={i} x={x(i)} y={H-6} fontSize="9" fill={C.sub}
      textAnchor={i===0?"start":i===data.length-1?"end":"middle"}>{data[i].label}</text>)}
  </svg>);
}

function BarChartSVG({data,symbol}){
  if(!data.length) return <div style={{color:C.sub,fontSize:13,padding:"22px 0",textAlign:"center"}}>Not enough data yet</div>;
  const d=data.slice(0,12),W=320,H=150,P={t:8,r:6,b:22,l:44},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const hi=Math.max(...d.map(m=>Math.max(m.income,m.expense)),1);
  const gw=iw/d.length,bw=Math.min(gw*0.34,14),y=v=>P.t+ih-(v/hi)*ih;
  const kf=v=>Math.abs(v)>=1000?`${symbol}${(v/1000).toFixed(1)}k`:`${symbol}${v.toFixed(0)}`;
  return (<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
    {[hi,hi/2,0].map((t,i)=>(<g key={i}>
      <line x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)} stroke={C.border} strokeDasharray="3 3"/>
      <text x={P.l-6} y={y(t)+3.5} textAnchor="end" fontSize="9" fill={C.sub}>{kf(t)}</text></g>))}
    {d.map((m,i)=>{const cx=P.l+i*gw+gw/2;return(<g key={i}>
      <rect x={cx-bw-1} y={y(m.income)} width={bw} height={Math.max(0,P.t+ih-y(m.income))} fill={C.income} rx="2"/>
      <rect x={cx+1} y={y(m.expense)} width={bw} height={Math.max(0,P.t+ih-y(m.expense))} fill={C.expense} rx="2"/>
      {(d.length<=6||i%2===0)&&<text x={cx} y={H-8} textAnchor="middle" fontSize="8" fill={C.sub}>{m.label}</text>}
    </g>);})}
  </svg>);
}

// ── Entry form ───────────────────────────────────────────────────────
const CATS=["Income","Housing","Utilities","Auto","Insurance","Food & Dining","Transport","Healthcare","Subscriptions","Savings","Credit card","Transfer","Other"];
const BUDGET_CATS=CATS.filter(c=>c!=="Income"&&c!=="Transfer");
const FREQ={once:"One-time",weekly:"Weekly",biweekly:"Every 2 weeks","monthly-date":"Monthly (by date)","monthly-dow":"Monthly (day of week)",annually:"Annually",custom:"Custom interval"};
const NTH={1:"1st",2:"2nd",3:"3rd",4:"4th","-1":"Last"};

const blank=(acctId,forecastYear)=>({id:uid(),accountId:acctId,toAccountId:"",type:"expense",name:"",vendor:"",split:false,
  trackedCats:[],typicalDeductions:{},incomeItems:[],grossAmount:"",
  category:"Utilities",amount:"",startDate:ymd(new Date()),endDate:`${forecastYear||new Date().getFullYear()+1}-12-31`,frequency:"monthly-date",
  monthlyDay:1,dowIndex:2,nthWeek:1,customInterval:1,customUnit:"months"});

const STEP_TITLE={type:"Type & account",detail:"Details",identity:"Name & payee",amount:"Amount",schedule:"Dates & frequency",review:"Review"};

function freqSummary(e){
  if(e.frequency==="monthly-date") return `Monthly, day ${e.monthlyDay}`;
  if(e.frequency==="monthly-dow") return `Monthly, ${NTH[e.nthWeek]} ${DAYS[e.dowIndex]}`;
  if(e.frequency==="custom") return `Every ${e.customInterval} ${e.customUnit}`;
  return FREQ[e.frequency];
}

function AddItemModal({title,placeholder,options,onSave,onCancel}){
  const [val,setVal]=useState(options?(options[0]||""):"");
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(20,18,14,0.5)",zIndex:600,
                 display:"flex",alignItems:"center",justifyContent:"center",padding:20}}
      onClick={ev=>{ if(ev.target===ev.currentTarget) onCancel(); }}>
      <div style={{background:C.card,borderRadius:14,padding:20,width:"100%",maxWidth:360,
                   boxShadow:"0 10px 40px rgba(0,0,0,0.25)"}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:14}}>{title}</div>
        {options
          ? (options.length
              ? <Sel value={val} onChange={v=>setVal(v.target.value)} autoFocus>
                  {options.map(o=><option key={o} value={o}>{o}</option>)}
                </Sel>
              : <div style={{fontSize:13,color:C.sub}}>Every category has already been added.</div>)
          : <Inp placeholder={placeholder} value={val} onChange={v=>setVal(v.target.value)} autoFocus
              onKeyDown={v=>{if(v.key==="Enter"){v.preventDefault(); if(val.trim())onSave(val.trim());}}}/>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
          <Btn v="ghost" onClick={onCancel}>Cancel</Btn>
          <Btn onClick={()=>val.trim()&&onSave(val.trim())} style={{opacity:val.trim()?1:.4}}>Save</Btn>
        </div>
      </div>
    </div>
  );
}

// A single "name ⟷ value" row used in the paystub-style income/deduction breakdown
function LineItemRow({name,value,onChange,onRemove,prefix}){
  return (
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
      <span style={{fontSize:13,color:C.text,flex:1,minWidth:0,overflow:"hidden",
                    textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prefix}{name}</span>
      <Inp type="number" inputMode="decimal" step="0.01" placeholder="0.00" value={value}
        onChange={v=>onChange(v.target.value)}
        style={{width:104,flexShrink:0,textAlign:"right",padding:"7px 9px",fontSize:14}}/>
      <button onClick={onRemove} style={{border:"none",background:"transparent",color:C.sub,
        fontSize:16,cursor:"pointer",padding:"2px 4px",flexShrink:0}}>×</button>
    </div>
  );
}

function EntryForm({initial,accounts,defaultAcct,forecastYear,onSave,onCancel}){
  const [e,setE]=useState(initial||blank(defaultAcct,forecastYear));
  const [step,setStep]=useState(0);
  const [addModal,setAddModal]=useState(null); // null | "income" | "deduction" | "expenseCat"
  const s=(k,v)=>setE(p=>({...p,[k]:v}));
  const acctById=Object.fromEntries(accounts.map(a=>[a.id,a]));
  const derivedNet=e.split&&(e.type==="income"||e.type==="expense");
  const steps=derivedNet
    ? ["type","identity","schedule","detail","review"]
    : ["type","identity","schedule","detail","amount","review"];

  const addDeduction=name=>setE(p=>({...p,
    trackedCats:[...(p.trackedCats||[]).filter(x=>x!==name),name],
    typicalDeductions:{...(p.typicalDeductions||{}),[name]:(p.typicalDeductions||{})[name]??""}}));
  const removeDeduction=name=>setE(p=>{const td={...(p.typicalDeductions||{})}; delete td[name];
    return {...p,trackedCats:(p.trackedCats||[]).filter(x=>x!==name),typicalDeductions:td};});
  const setDeductionAmt=(name,val)=>setE(p=>({...p,typicalDeductions:{...(p.typicalDeductions||{}),[name]:val}}));

  const addIncomeItem=name=>setE(p=>({...p,incomeItems:[...(p.incomeItems||[]),{id:uid(),name,amount:""}]}));
  const removeIncomeItem=id=>setE(p=>({...p,incomeItems:(p.incomeItems||[]).filter(it=>it.id!==id)}));
  const setIncomeItemAmt=(id,val)=>setE(p=>({...p,incomeItems:(p.incomeItems||[]).map(it=>it.id===id?{...it,amount:val}:it)}));

  const addExpenseCat=name=>setE(p=>({...p,
    trackedCats:[...(p.trackedCats||[]).filter(x=>x!==name),name],
    typicalDeductions:{...(p.typicalDeductions||{}),[name]:(p.typicalDeductions||{})[name]??""}}));

  const grossTotal=(e.incomeItems||[]).reduce((a,it)=>a+(parseFloat(it.amount)||0),0);
  const dedTotal=(e.trackedCats||[]).reduce((a,cat)=>a+(parseFloat((e.typicalDeductions||{})[cat])||0),0);
  const netTotal=grossTotal-dedTotal;

  // When a split income breakdown is in play, the net deposit is computed from
  // it directly — no need to ask the person to re-type the same number.
  useEffect(()=>{
    if(e.split && e.type==="income"){
      const net=netTotal.toFixed(2);
      if(e.amount!==net) setE(p=>({...p,amount:net}));
    } else if(e.split && e.type==="expense"){
      const tot=dedTotal.toFixed(2);
      if(e.amount!==tot) setE(p=>({...p,amount:tot}));
    }
  },[e.type,e.split,grossTotal,dedTotal]);
  const ok=e.name.trim()&&e.amount!==""&&e.startDate&&(e.frequency==="once"||e.endDate)&&e.accountId
    &&(e.type!=="transfer"||!e.toAccountId||e.toAccountId!==e.accountId);
  const G=({children})=>(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>{children}</div>);

  const key=steps[step];
  const canNext=
    key==="detail" ? (e.type!=="transfer"||!e.toAccountId||e.toAccountId!==e.accountId) :
    key==="identity" ? (!!e.name.trim()&&!!e.accountId) :
    key==="amount" ? e.amount!=="" :
    key==="schedule" ? (!!e.startDate&&(e.frequency==="once"||!!e.endDate)) :
    true;
  const isLast=step===steps.length-1;
  const goNext=()=>{ if(isLast){ if(ok) onSave(e); return; } if(canNext) setStep(st=>Math.min(st+1,steps.length-1)); };
  const goBack=()=>{ if(step===0) onCancel(); else setStep(st=>st-1); };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(20,18,14,0.45)",zIndex:500,
                 display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={ev=>{ if(ev.target===ev.currentTarget) onCancel(); }}>
      <div style={{background:C.card,width:"100%",maxWidth:480,maxHeight:"88vh",
                   borderRadius:"18px 18px 0 0",display:"flex",flexDirection:"column",
                   boxShadow:"0 -8px 30px rgba(0,0,0,0.18)"}}>

        {/* header */}
        <div style={{padding:"16px 18px 12px",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:16}}>{initial?"Edit entry":"New entry"} · {STEP_TITLE[key]}</div>
            <button onClick={onCancel} style={{border:"none",background:"transparent",fontSize:20,
              color:C.sub,cursor:"pointer",lineHeight:1,padding:4}}>×</button>
          </div>
          <div style={{display:"flex",gap:4}}>
            {steps.map((_,i)=>(
              <div key={i} style={{flex:1,height:4,borderRadius:99,
                background:i<=step?C.accent:C.border}}/>))}
          </div>
        </div>

        {/* body */}
        <div style={{padding:18,overflowY:"auto",flex:1,display:"flex",flexDirection:"column",gap:14}}>

          {key==="type" && <>
            <div><Lab>{e.type==="transfer"?"From account":"Account"}</Lab>
              <Sel value={e.accountId} onChange={v=>s("accountId",v.target.value)}>
                {accounts.map(a=><option key={a.id} value={a.id}>
                  {a.name}{a.kind==="liability"?" · card":""}</option>)}
              </Sel>
              {acctById[e.accountId]?.kind==="liability" &&
                <div style={{fontSize:11.5,color:C.sub,marginTop:6,lineHeight:1.5}}>
                  Charged to this card. No cash moves on the charge date — it lands on the
                  statement and is paid off with the card payment.
                </div>}
            </div>
            <div><Lab>Type</Lab>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[["income","Income",C.income],["expense","Expense",C.expense],["transfer","Transfer",C.accent]].map(([val,label,col])=>(
                  <button key={val} onClick={()=>{const t=val;
                    setE(p=>({...p,type:t,
                      category:t==="income"?"Income":t==="transfer"?"Transfer":(p.category==="Income"?"Utilities":p.category),
                      toAccountId:t==="transfer"?p.toAccountId:"",
                      split:t==="transfer"?false:p.split}));}}
                    style={{padding:"14px 6px",borderRadius:10,cursor:"pointer",textAlign:"center",
                      border:`2px solid ${e.type===val?col:C.border}`,
                      background:e.type===val?col+"12":"#fff",
                      color:e.type===val?col:C.text,fontWeight:700,fontSize:13.5}}>
                    {label}
                  </button>))}
              </div>
            </div>
          </>}

          {key==="detail" && e.type!=="transfer" && <>
            {e.type==="expense" && !e.split &&
              <div><Lab>Category</Lab>
                <Sel value={e.category} onChange={v=>s("category",v.target.value)}>
                  {CATS.filter(c=>c!=="Income"&&c!=="Transfer").map(c=><option key={c}>{c}</option>)}
                </Sel></div>}
            <div style={{border:`1px solid ${e.split?C.accent+"55":C.border}`,borderRadius:11,
                         padding:e.split?"13px 13px 14px":"11px 13px",background:e.split?C.accent+"08":"transparent"}}>
              <label style={{display:"flex",alignItems:"center",gap:10,userSelect:"none"}}>
                <input type="checkbox" checked={!!e.split}
                  onChange={v=>setE(p=>({...p,split:v.target.checked,
                    trackedCats:v.target.checked&&!(p.trackedCats||[]).length
                      ?(p.type==="income"?["Income tax","CPP","EI","RRSP"]:["Food & Dining","Transport"])
                      :p.trackedCats,
                    typicalDeductions:v.target.checked&&!(p.trackedCats||[]).length
                      ?(p.type==="income"?{"Income tax":"","CPP":"","EI":"","RRSP":""}:{"Food & Dining":"","Transport":""})
                      :p.typicalDeductions,
                    incomeItems:v.target.checked&&p.type==="income"&&!(p.incomeItems||[]).length
                      ?[{id:uid(),name:"Regular pay",amount:""},{id:uid(),name:"Overtime",amount:""},
                        {id:uid(),name:"Bonus",amount:""},{id:uid(),name:"Employer RRSP contributions",amount:""}]
                      :p.incomeItems}))}
                  style={{width:19,height:19,accentColor:C.accent,flexShrink:0}}/>
                <span style={{fontSize:14,fontWeight:700}}>
                  {e.type==="income"?"Break down gross pay":"Break down into categories"}</span>
              </label>
              <div style={{fontSize:11.5,color:C.sub,marginTop:6,lineHeight:1.5,paddingLeft:29}}>
                {e.type==="income"
                  ? "For a paycheque — lay out your typical earnings and deductions, paystub-style."
                  : "For a credit card statement or a bundled bill — one payment covering several categories."}
              </div>

              {e.split && e.type==="income" && <div style={{marginTop:14}}>
                <Lab>Income</Lab>
                {(e.incomeItems||[]).map(it=>(
                  <LineItemRow key={it.id} name={it.name} value={it.amount}
                    onChange={v=>setIncomeItemAmt(it.id,v)} onRemove={()=>removeIncomeItem(it.id)}/>))}
                <Btn v="ghost" style={{padding:"7px 12px",fontSize:12.5,marginTop:2}}
                  onClick={()=>setAddModal("income")}>+ Add income line</Btn>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,
                             marginTop:10,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
                  <span>Gross pay</span><span>${grossTotal.toFixed(2)}</span>
                </div>

                <div style={{marginTop:16}}><Lab>Deductions</Lab></div>
                {(e.trackedCats||[]).map(cat=>(
                  <LineItemRow key={cat} name={cat} prefix="− " value={(e.typicalDeductions||{})[cat]||""}
                    onChange={v=>setDeductionAmt(cat,v)} onRemove={()=>removeDeduction(cat)}/>))}
                {!(e.trackedCats||[]).length &&
                  <div style={{fontSize:12.5,color:C.sub,marginBottom:8}}>
                    None yet — everything will fall into Other deductions.</div>}
                <Btn v="ghost" style={{padding:"7px 12px",fontSize:12.5,marginTop:2}}
                  onClick={()=>setAddModal("deduction")}>+ Add deduction</Btn>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,
                             marginTop:10,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
                  <span>Total deductions</span><span>${dedTotal.toFixed(2)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:800,
                             color:C.accent,marginTop:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
                  <span>Net deposit</span><span>${netTotal.toFixed(2)}</span>
                </div>
                <div style={{fontSize:11.5,color:C.sub,marginTop:9,lineHeight:1.5}}>
                  These are typical figures — the actual earnings and deductions all get
                  entered per paycheque at reconcile time, and the net is calculated from them.
                </div>
              </div>}

              {e.split && e.type==="expense" && <div style={{marginTop:14}}>
                <Lab>Categories</Lab>
                {(e.trackedCats||[]).map(cat=>(
                  <LineItemRow key={cat} name={cat} value={(e.typicalDeductions||{})[cat]||""}
                    onChange={v=>setDeductionAmt(cat,v)} onRemove={()=>removeDeduction(cat)}/>))}
                {!(e.trackedCats||[]).length &&
                  <div style={{fontSize:12.5,color:C.sub,marginBottom:8}}>
                    None yet — add the categories this payment covers.</div>}
                <Btn v="ghost" style={{padding:"7px 12px",fontSize:12.5,marginTop:2}}
                  onClick={()=>setAddModal("expenseCat")}>+ Add category</Btn>

                             color:C.accent,marginTop:10,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
                  <span>Total payment</span><span>${dedTotal.toFixed(2)}</span>
                </div>
                <div style={{fontSize:11.5,color:C.sub,marginTop:9,lineHeight:1.5}}>
                  These are typical figures — the actual amount for each category gets entered

                </div>
              </div>}
            </div>
          </>}

          {key==="detail" && e.type==="transfer" && <>
            <div><Lab>To account (optional)</Lab>
              <Sel value={e.toAccountId} onChange={v=>s("toAccountId",v.target.value)}>
                <option value="">Outside — leaves your accounts</option>
                {accounts.filter(a=>a.id!==e.accountId).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
              </Sel>
              <div style={{fontSize:11.5,color:C.sub,marginTop:6}}>
                Pick an account and the matching deposit is created automatically on the other side.
              </div>
            </div>

          {key==="identity" && <>
            <div><Lab>Name</Lab><Inp placeholder={e.type==="income"?"Husband/Wife Pay":"Electricity Bill"}

            <div><Lab>{e.type==="income"?"Source":"Payee / Source"}</Lab>

          {key==="amount" && <>

          {key==="schedule" && <>
            <div><Lab>Frequency</Lab>

            {e.frequency==="monthly-date" &&
              <div><Lab>Day of month</Lab><Inp type="number" inputMode="numeric" min="1" max="31"
                value={e.monthlyDay??""}
                onChange={v=>{const raw=v.target.value;
                  s("monthlyDay",raw===""?"":parseInt(raw,10));}}
                onBlur={v=>{const n=parseInt(v.target.value,10);
                  s("monthlyDay",isNaN(n)?1:Math.min(31,Math.max(1,n)));}}/></div>}
            {e.frequency==="monthly-dow" &&
              <G><div><Lab>Week</Lab><Sel value={e.nthWeek} onChange={v=>s("nthWeek",parseInt(v.target.value))}>
                  {[1,2,3,4,-1].map(n=><option key={n} value={n}>{NTH[n]}</option>)}</Sel></div>
                <div><Lab>Day</Lab><Sel value={e.dowIndex} onChange={v=>s("dowIndex",parseInt(v.target.value))}>
                  {DAYS.map((d,i)=><option key={d} value={i}>{d}</option>)}</Sel></div></G>}
            {e.frequency==="custom" &&
              <G><div><Lab>Every</Lab><Inp type="number" inputMode="numeric" min="1"
                  value={e.customInterval??""}
                  onChange={v=>{const raw=v.target.value;
                    s("customInterval",raw===""?"":parseInt(raw,10));}}
                  onBlur={v=>{const n=parseInt(v.target.value,10);
                    s("customInterval",isNaN(n)?1:Math.max(1,n));}}/></div>
                <div><Lab>Unit</Lab><Sel value={e.customUnit} onChange={v=>s("customUnit",v.target.value)}>
                  <option value="days">Days</option><option value="weeks">Weeks</option><option value="months">Months</option>
                </Sel></div></G>}
            {e.frequency==="once" ? (
              <div><Lab>Date</Lab><Inp type="date" value={e.startDate} onChange={v=>s("startDate",v.target.value)}/></div>
            ) : (<>
              <div><Lab>Starts</Lab><Inp type="date" value={e.startDate} onChange={v=>s("startDate",v.target.value)}/></div>
              <div><Lab>Ends</Lab><Inp type="date" value={e.endDate} onChange={v=>s("endDate",v.target.value)}/></div>
            </>)}
          </>}

          {key==="review" && <>
            <Card style={{padding:14}}>
              <div style={{display:"flex",flexDirection:"column",gap:9,fontSize:13.5}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Account</span>
                  <span style={{fontWeight:700}}>{acctById[e.accountId]?.name||"—"}
                    {e.type==="transfer" && (e.toAccountId ? ` → ${acctById[e.toAccountId]?.name}` : " → Outside")}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Type</span>
                  <Tag color={e.type==="income"?C.income:e.type==="expense"?C.expense:C.accent}>{e.type}</Tag>
                </div>
                {e.type!=="transfer" && !(e.split&&e.type==="expense") &&
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{color:C.sub}}>Category</span><span style={{fontWeight:700}}>{e.category}</span>
                  </div>}
                {e.split && e.type==="income" && ((e.incomeItems||[]).length>0 || (e.trackedCats||[]).length>0) &&
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    {(e.incomeItems||[]).map(it=>(
                      <div key={it.id} style={{display:"flex",justifyContent:"space-between",fontSize:12.5}}>
                        <span style={{color:C.sub}}>{it.name}</span>
                        <span>{it.amount?`$${parseFloat(it.amount).toFixed(2)}`:"—"}</span>
                      </div>))}
                    {(e.trackedCats||[]).map(cat=>(
                      <div key={cat} style={{display:"flex",justifyContent:"space-between",fontSize:12.5}}>
                        <span style={{color:C.sub}}>− {cat}</span>
                        <span>{(e.typicalDeductions||{})[cat]?`$${parseFloat((e.typicalDeductions||{})[cat]).toFixed(2)}`:"—"}</span>
                      </div>))}
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,
                                 marginTop:4,paddingTop:6,borderTop:`1px solid ${C.border}`}}>
                      <span>Net</span><span>${netTotal.toFixed(2)}</span>
                    </div>
                  </div>}
                {e.split && e.type==="expense" && (e.trackedCats||[]).length>0 &&
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    {(e.trackedCats||[]).map(cat=>(
                      <div key={cat} style={{display:"flex",justifyContent:"space-between",fontSize:12.5}}>
                        <span style={{color:C.sub}}>{cat}</span>
                        <span>{(e.typicalDeductions||{})[cat]?`$${parseFloat((e.typicalDeductions||{})[cat]).toFixed(2)}`:"—"}</span>
                      </div>))}
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,
                                 marginTop:4,paddingTop:6,borderTop:`1px solid ${C.border}`}}>
                      <span>Total</span><span>${dedTotal.toFixed(2)}</span>
                    </div>
                  </div>}
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Name</span><span style={{fontWeight:700}}>{e.name||"—"}</span>
                </div>
                {e.vendor && <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Payee</span><span style={{fontWeight:700}}>{e.vendor}</span>
                </div>}
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Amount</span>
                  <span style={{fontWeight:700}}>{e.amount?`$${parseFloat(e.amount).toFixed(2)}`:"—"}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Frequency</span><span style={{fontWeight:700}}>{freqSummary(e)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Starts</span><span style={{fontWeight:700}}>{e.startDate}</span>
                </div>
                {e.endDate && e.frequency!=="once" && <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:C.sub}}>Ends</span><span style={{fontWeight:700}}>{e.endDate}</span>
                </div>}
              </div>
            </Card>
            {!ok && <div style={{fontSize:12,color:C.expense}}>Check the earlier steps — something required is still missing.</div>}
          </>}
        </div>

        {/* footer */}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",padding:16,
                     borderTop:`1px solid ${C.border}`,flexShrink:0}}>
          <Btn v="ghost" onClick={goBack}>{step===0?"Cancel":"Back"}</Btn>
          <Btn onClick={goNext} style={{opacity:isLast?(ok?1:.4):(canNext?1:.4)}}>{isLast?"Save":"Next"}</Btn>
        </div>
      </div>

      {addModal==="income" &&
        <AddItemModal title="Add income line" placeholder="e.g. Shift premium"
          onSave={name=>{addIncomeItem(name);setAddModal(null);}} onCancel={()=>setAddModal(null)}/>}
      {addModal==="deduction" &&
        <AddItemModal title="Add deduction" placeholder="e.g. Union dues"
          onSave={name=>{addDeduction(name);setAddModal(null);}} onCancel={()=>setAddModal(null)}/>}
      {addModal==="expenseCat" &&
        <AddItemModal title="Add category"
          options={CATS.filter(c=>c!=="Income"&&c!=="Transfer"&&!(e.trackedCats||[]).includes(c))}
          onSave={name=>{addExpenseCat(name);setAddModal(null);}} onCancel={()=>setAddModal(null)}/>}
    </div>
  );
}


// ── Excel export ─────────────────────────────────────────────────────
// Writes live formulas, not baked numbers, so the workbook recalculates
// if someone edits an amount in Excel.
function buildWorkbook(st,perAccount,combined,combinedOpening,acctById,forecastYear){
  const wb=XLSX.utils.book_new();
  const MONEY='#,##0.00;[Red]-#,##0.00';
  const safe=n=>(n||"Account").replace(/[\[\]\*\?\/\\:]/g,"-").slice(0,28);
  const A1=(col,row)=>XLSX.utils.encode_cell({c:col,r:row});

  // ── Summary ──
  const sRows=[
    ["Ledgerwise — cash flow forecast"],
    ["Generated",ymd(new Date())],
    ["Forecast through",forecastYear],
    [],
    ["Account","Opening","Current balance","Available to spend","Low point","Confirmed","Forecast rows"],
  ];
  perAccount.forEach(p=>sRows.push([p.account.name,+p.account.opening||0,p.current,p.available,
    p.lowDate?pretty(p.lowDate):"no dip",p.nPosted,p.fc.length]));
  if(st.accounts.length>1)
    sRows.push(["All accounts",combinedOpening,combined.current,combined.available,
      combined.lowDate?pretty(combined.lowDate):"no dip",combined.nPosted,combined.fc.length]);
  sRows.push([]);
  sRows.push(["Current balance = opening balance plus every transaction marked cleared, at actual amounts."]);
  sRows.push(["Available to spend = the lowest point the running balance reaches anywhere in the forecast."]);
  sRows.push(["Internal transfers between your own accounts are excluded from the All accounts row."]);
  const ws=XLSX.utils.aoa_to_sheet(sRows);
  for(let r=6;r<6+perAccount.length+(st.accounts.length>1?1:0);r++)
    for(const col of [1,2,3]){const a=A1(col,r); if(ws[a])ws[a].z=MONEY;}
  ws['!cols']=[{wch:26},{wch:13},{wch:16},{wch:18},{wch:16},{wch:9},{wch:13}];
  XLSX.utils.book_append_sheet(wb,ws,"Summary");

  // ── One sheet per account, mirroring the ledger ──
  perAccount.forEach(p=>{
    const cleared=p.occ.filter(o=>o.posted);
    const rows=[
      [p.account.name],
      ["Status","Date","Name","Payee","Category","Type","Amount","Balance","Available"],
      ["x","","Opening balance","","","",+p.account.opening||0],
    ];
    cleared.forEach(o=>rows.push(["x",o.date,o.name,o.vendor||"",o.category,o.type,o.amount]));
    const totalR=rows.length;                 // 0-based index of the totals row
    rows.push(["Current balance","","","","","",null,null,null]);
    p.fc.forEach(o=>rows.push(["",o.date,o.name,o.vendor||"",o.category,o.type,o.forecast,null,null]));
    const lastR=rows.length-1;

    const w=XLSX.utils.aoa_to_sheet(rows);
    const xr=i=>i+1;                          // 0-based index → Excel row number

    // Current balance = sum of opening + every cleared amount
    w[A1(6,totalR)]={t:'n',f:`SUM(G${xr(2)}:G${xr(totalR-1)})`,z:MONEY};
    w[A1(7,totalR)]={t:'n',f:`G${xr(totalR)}`,z:MONEY};

    // Running balance, and available = lowest point from here to the end
    for(let i=totalR+1;i<=lastR;i++){
      w[A1(7,i)]={t:'n',f:`G${xr(i)}+H${xr(i-1)}`,z:MONEY};
      w[A1(8,i)]={t:'n',f:`MIN(H${xr(i)}:H${xr(lastR)})`,z:MONEY};
      w[A1(6,i)].z=MONEY;
    }
    // Available on the totals row looks across the whole forecast
    if(lastR>totalR) w[A1(8,totalR)]={t:'n',f:`MIN(H${xr(totalR)}:H${xr(lastR)})`,z:MONEY};
    for(let i=2;i<totalR;i++){const a=A1(6,i); if(w[a])w[a].z=MONEY;}

    w['!cols']=[{wch:15},{wch:12},{wch:26},{wch:20},{wch:16},{wch:11},{wch:13},{wch:13},{wch:13}];
    w['!freeze']={xSplit:0,ySplit:2};
    XLSX.utils.book_append_sheet(wb,w,safe(p.account.name));
  });

  // ── Annual summary: one column per year ──
  {
    const all=[]; perAccount.forEach(p=>p.occ.forEach(o=>all.push(o)));
    const yrs=[...new Set(all.map(o=>o.date.slice(0,4)))].sort();
    if(yrs.length){
      const inc={},exp={},cats={},ded={},gross={},netPay={};
      const bump=(m,y,v)=>m[y]=(m[y]||0)+v;
      for(const o of all){
        const y=o.date.slice(0,4), amt=o.posted?o.amount:o.forecast;
        if(amt>0) bump(inc,y,amt); else bump(exp,y,-amt);
        if(amt<0){const k=o.category||"Other"; cats[k]=cats[k]||{}; bump(cats[k],y,-amt);}
        if(o.posted&&o.isSplit){
          const items=Object.entries(o.split||{});
          const sum=items.reduce((s,[,v])=>s+(+v||0),0);
          if(o.isIncome){
            const g=+o.gross||0;
            if(g>0){bump(gross,y,g); bump(netPay,y,Math.abs(o.amount));
              items.forEach(([k,v])=>{ded[k]=ded[k]||{}; bump(ded[k],y,+v||0);});
              const oth=g-Math.abs(o.amount)-sum;
              if(oth>0.005){ded["Other deductions"]=ded["Other deductions"]||{}; bump(ded["Other deductions"],y,oth);}}
          }
        }
      }
      const rows=[["Annual summary"],["Metric",...yrs],[],
        ["Money in",...yrs.map(y=>inc[y]||0)],
        ["Money out",...yrs.map(y=>exp[y]||0)],
        ["Net",...yrs.map(y=>(inc[y]||0)-(exp[y]||0))],
        []];
      rows.push(["Expenses by category"]);
      Object.keys(cats).sort().forEach(k=>rows.push([k,...yrs.map(y=>cats[k][y]||0)]));
      if(Object.keys(ded).length){
        rows.push([]); rows.push(["Pay: gross to net"]);
        rows.push(["Gross earnings",...yrs.map(y=>gross[y]||0)]);
        Object.keys(ded).sort().forEach(k=>rows.push(["  less "+k,...yrs.map(y=>ded[k][y]||0)]));
        rows.push(["Net deposited",...yrs.map(y=>netPay[y]||0)]);
      }
      const wy=XLSX.utils.aoa_to_sheet(rows);
      for(let r=0;r<rows.length;r++)
        for(let cc=1;cc<=yrs.length;cc++){const a=A1(cc,r); if(wy[a]&&typeof wy[a].v==="number")wy[a].z=MONEY;}
      wy['!cols']=[{wch:30},...yrs.map(()=>({wch:14}))];
      wy['!freeze']={xSplit:1,ySplit:2};
      XLSX.utils.book_append_sheet(wb,wy,"Annual summary");
    }
  }

  // ── Split detail: card/bill categories and pay deductions ──
  const splitRows=[["Account","Date","Entry","Kind","Gross","Net / total","Component","Amount"]];
  perAccount.forEach(p=>p.occ.filter(o=>o.posted&&o.isSplit).forEach(o=>{
    const net=Math.abs(o.actual||0), gross=+o.gross||0;
    const kind=o.isIncome?"Pay":"Payment";
    let itemised=0;
    Object.entries(o.split||{}).forEach(([k,v])=>{itemised+=+v||0;
      splitRows.push([p.account.name,o.date,o.name,kind,o.isIncome?gross:"",net,k,+v||0]);});
    const other=o.isIncome?(gross-net-itemised):(net-itemised);
    if(other>0.005) splitRows.push([p.account.name,o.date,o.name,kind,o.isIncome?gross:"",net,
      o.isIncome?"Other deductions":"Other",other]);
  }));
  if(splitRows.length>1){
    const wsp=XLSX.utils.aoa_to_sheet(splitRows);
    for(let r=1;r<splitRows.length;r++)
      for(const col of [4,5,7]){const a=A1(col,r); if(wsp[a])wsp[a].z=MONEY;}
    wsp['!cols']=[{wch:22},{wch:12},{wch:22},{wch:10},{wch:13},{wch:13},{wch:22},{wch:13}];
    wsp['!freeze']={xSplit:0,ySplit:1};
    XLSX.utils.book_append_sheet(wb,wsp,"Split detail");
  }

  // ── Rules: the recurring entries themselves ──
  const rRows=[["Account","To account","Type","Name","Payee","Category","Amount","Frequency","Detail","Starts","Ends","Tracked components"]];
  st.entries.forEach(e=>rRows.push([
    acctById[e.accountId]?.name||"",
    e.toAccountId?(acctById[e.toAccountId]?.name||""):"",
    e.type,e.name,e.vendor||"",e.category,Math.abs(parseFloat(e.amount)||0),FREQ[e.frequency],
    e.frequency==="monthly-date"?`day ${e.monthlyDay}`
      :e.frequency==="monthly-dow"?`${NTH[e.nthWeek]} ${DAYS[e.dowIndex]}`
      :e.frequency==="custom"?`every ${e.customInterval} ${e.customUnit}`:"",
    e.startDate,e.endDate||`end of ${forecastYear}`,
    e.split?(e.trackedCats||[]).join(", "):""]));
  const wr=XLSX.utils.aoa_to_sheet(rRows);
  for(let r=1;r<rRows.length;r++){const a=A1(6,r); if(wr[a])wr[a].z=MONEY;}
  wr['!cols']=[{wch:20},{wch:20},{wch:11},{wch:24},{wch:20},{wch:16},{wch:12},{wch:20},{wch:16},{wch:12},{wch:16},{wch:30}];
  wr['!freeze']={xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(wb,wr,"Rules");

  return wb;
}

// ── Ledger row ───────────────────────────────────────────────────────
function seedRowDraft(o){
  if(o.isSplit){
    if(o.isIncome && (o.incomeLines||[]).length){
      return {
        incomeLines:Object.fromEntries(o.incomeLines.map(name=>[name,
          o.grossSplit?.[name]!==undefined?String(o.grossSplit[name])
            :(o.typicalIncomeLines?.[name]!==undefined&&o.typicalIncomeLines[name]!==""?String(o.typicalIncomeLines[name]):"")])),
        splits:Object.fromEntries((o.trackedCats||[]).map(cat=>[cat,
          o.split?.[cat]!==undefined?String(o.split[cat])
            :(o.typicalSplit?.[cat]!==undefined&&o.typicalSplit[cat]!==""?String(o.typicalSplit[cat]):"")]))
      };
    }
    return {
      gross:o.gross!==undefined?String(o.gross):(o.typicalGross?String(o.typicalGross):""),
      splits:Object.fromEntries((o.trackedCats||[]).map(cat=>[cat,
        o.split?.[cat]!==undefined?String(o.split[cat])
          :(o.typicalSplit?.[cat]!==undefined&&o.typicalSplit[cat]!==""?String(o.typicalSplit[cat]):"")]))
    };
  }
  return {amount:o.posted?String(Math.abs(o.actual)):""};
}

function Row({o,fmt,setSt,runBal,avail,isLow,acctName,acctColor}){
  const shown=o.posted?o.amount:o.forecast;
  const color=shown>0?C.income:C.expense;
  const bg=o.posted?"#f0fdf4":o.awaiting?"#fff7ed":isLow?"#fffbeb":C.card;
  const bd=o.posted?"#bbf7d0":o.awaiting?"#fdba74":isLow?"#fcd34d":C.border;

  // Fully local until "OK" is pressed — this is what lets someone paste values,
  // override any line, and watch the subtotal update without losing keystrokes
  // to a mid-edit re-render when the row jumps between Forecast and Posted.
  const [expanded,setExpanded]=useState(()=>!o.posted);
  const [draft,setDraft]=useState(()=>seedRowDraft(o));
  const editDraft=()=>{setDraft(seedRowDraft(o));setExpanded(true);};

  const uncheck=()=>{
    if(o.posted && !window.confirm("Un-clear this entry? The amount you entered will be removed."))return;
    setSt(p=>{const cl={...p.cleared},ac={...p.actuals},sp={...(p.splits||{})},gr={...(p.grosses||{})},gs={...(p.grossSplits||{})};
      delete cl[o.key];delete ac[o.key];delete sp[o.key];delete gr[o.key];delete gs[o.key];
      return{...p,cleared:cl,actuals:ac,splits:sp,grosses:gr,grossSplits:gs};});
  };
  const check=()=>setSt(p=>({...p,cleared:{...p.cleared,[o.key]:true}}));

  const fullPaystub=o.isIncome&&(o.incomeLines||[]).length>0;

  const commitSplit=()=>{
    setSt(p=>{
      const g={...(p.grosses||{})},a={...p.actuals},sp={...(p.splits||{})},gs={...(p.grossSplits||{})};
      const dedRow={};
      for(const cat of (o.trackedCats||[])){
        const v=draft.splits[cat];
        if(v!==undefined&&v!=="")dedRow[cat]=Math.abs(parseFloat(v)||0);
      }
      if(Object.keys(dedRow).length)sp[o.key]=dedRow;else delete sp[o.key];
      if(o.isIncome){
        let grossVal,anyFilled;
        if(fullPaystub){
          const incRow={};
          for(const name of o.incomeLines){
            const v=draft.incomeLines[name];
            if(v!==undefined&&v!=="")incRow[name]=Math.abs(parseFloat(v)||0);
          }
          if(Object.keys(incRow).length)gs[o.key]=incRow;else delete gs[o.key];
          grossVal=Object.values(incRow).reduce((s,v)=>s+v,0);
          anyFilled=Object.keys(incRow).length>0||Object.keys(dedRow).length>0;
        }else{
          delete gs[o.key];
          grossVal=Math.abs(parseFloat(draft.gross)||0);
          anyFilled=draft.gross!==""||Object.keys(dedRow).length>0;
        }
        if(!anyFilled){delete g[o.key];delete a[o.key];}
        else{g[o.key]=grossVal;a[o.key]=Math.max(0,grossVal-Object.values(dedRow).reduce((s,v)=>s+v,0));}
      }else{
        const tot=Object.values(dedRow).reduce((s,v)=>s+v,0);
        if(!Object.keys(dedRow).length)delete a[o.key];else a[o.key]=tot;
      }
      return{...p,grosses:g,actuals:a,splits:sp,grossSplits:gs};
    });
    setExpanded(false);
  };
  const commitSimple=()=>{
    setSt(p=>{const a={...p.actuals};
      if(draft.amount==="")delete a[o.key];else a[o.key]=Math.abs(parseFloat(draft.amount)||0);
      return{...p,actuals:a};});
    setExpanded(false);
  };

  // Live subtotal from the draft — recalculates on every keystroke or paste,
  // and works the same whether a line was typed or overridden.
  const itemised=o.isSplit?Object.values(draft.splits).reduce((s,v)=>s+(parseFloat(v)||0),0):0;
  const grossNum=fullPaystub
    ?Object.values(draft.incomeLines||{}).reduce((s,v)=>s+(parseFloat(v)||0),0)
    :parseFloat(draft.gross)||0;
  const netNum=o.isIncome?(grossNum-itemised):itemised;
  const netOver=o.isIncome&&netNum<-0.005;

  return (
    <div style={{display:"flex",gap:4,alignItems:"stretch"}}>
    <div style={{flex:1,minWidth:0,background:bg,border:`1px solid ${bd}`,borderRadius:10,padding:"10px 6px"}}>
      <div style={{display:"flex",gap:3}}>
        <div style={{flex:1,minWidth:0,textAlign:"right"}}>
          <div style={{fontSize:8.5,fontWeight:700,color:C.sub,textTransform:"uppercase",
                       letterSpacing:".04em",marginBottom:3}}>Amount</div>
          <div style={{fontWeight:800,fontSize:12,color,overflow:"hidden",whiteSpace:"nowrap"}}>
            {shown<0?"−":"+"}{fmt(shown)}
          </div>
        </div>
        <div style={{flex:1,minWidth:0,textAlign:"right"}}>
          <div style={{fontSize:8.5,fontWeight:700,color:C.sub,textTransform:"uppercase",
                       letterSpacing:".04em",marginBottom:3}}>Balance</div>
          <div style={{fontWeight:700,fontSize:12,overflow:"hidden",whiteSpace:"nowrap",
                       color:runBal!==undefined&&runBal<0?C.expense:C.text}}>
            {runBal!==undefined?(runBal<0?"−":"")+fmt(runBal):"—"}
          </div>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,
                   marginTop:7,paddingTop:7,borderTop:`1px solid ${bd}`,marginBottom:7}}>
        <div style={{fontWeight:700,fontSize:14.5,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {o.name}{o.mirror?" ↓":""}
        </div>
        <div style={{fontSize:11.5,color:C.sub,flexShrink:0}}>{pretty(o.date)}</div>
      </div>

      {o.ticked && o.isSplit && (!o.posted || expanded) &&
        <div style={{background:o.posted?"#f0f7ff":"#fff1e2",
                     border:`1px solid ${o.posted?"#dbeafe":"#fdba74"}`,
                     borderRadius:8,padding:"10px 11px",marginBottom:8}}>
          <div style={{fontSize:11.5,fontWeight:700,color:o.posted?C.accent:"#9a3412",marginBottom:9}}>
            {o.isIncome?"Enter gross and your deductions — net deposit is calculated":"Enter each category — the total is calculated"}
          </div>

          {o.isIncome && fullPaystub && o.incomeLines.map(name=>(
            <div key={name} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={{fontSize:12.5,color:C.sub,flex:1,minWidth:0,overflow:"hidden",
                            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</span>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00"
                value={draft.incomeLines[name]||""}
                onChange={ev=>setDraft(d=>({...d,incomeLines:{...d.incomeLines,[name]:ev.target.value}}))}
                style={{width:104,border:`1px solid ${o.posted?"#bfdbfe":"#fb923c"}`,borderRadius:7,
                        padding:"7px 9px",fontSize:15,outline:"none",background:"#fff",textAlign:"right"}}/>
            </div>))}

          {o.isIncome && fullPaystub &&
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,
                         marginTop:4,marginBottom:10,paddingTop:8,
                         borderTop:`1px solid ${o.posted?"#dbeafe":"#fdba74"}`}}>
              <span>Gross pay</span><span>{fmt(grossNum)}</span>
            </div>}

          {o.isIncome && !fullPaystub &&
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{fontSize:12.5,fontWeight:700,flex:1,minWidth:0}}>Gross pay</span>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00"
                value={draft.gross} onChange={ev=>setDraft(d=>({...d,gross:ev.target.value}))}
                style={{width:118,border:`1px solid ${o.posted?"#bfdbfe":"#fb923c"}`,borderRadius:7,
                        padding:"8px 9px",fontSize:16,outline:"none",background:"#fff",fontWeight:700,
                        textAlign:"right"}}/>
            </div>}

          {o.trackedCats.map(cat=>(
            <div key={cat} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={{fontSize:12.5,color:C.sub,flex:1,minWidth:0,overflow:"hidden",
                            textOverflow:"ellipsis",whiteSpace:"nowrap",paddingLeft:o.isIncome?10:0}}>
                {o.isIncome?"− ":""}{cat}</span>
              <input type="number" inputMode="decimal" step="0.01" placeholder="0.00"
                value={draft.splits[cat]||""}
                onChange={ev=>setDraft(d=>({...d,splits:{...d.splits,[cat]:ev.target.value}}))}
                style={{width:104,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 9px",
                        fontSize:15,outline:"none",background:"#fff",textAlign:"right"}}/>
            </div>))}

          {o.isIncome &&
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,
                         paddingTop:10,borderTop:`1px solid ${o.posted?"#dbeafe":"#fdba74"}`}}>
              <span style={{fontSize:13,fontWeight:700}}>Net deposited</span>
              <span style={{fontSize:18,fontWeight:800,color:netOver?C.expense:C.text}}>
                {netNum<0?"−":""}{fmt(netNum)}
              </span>
            </div>}
          {netOver &&
            <div style={{fontSize:11.5,color:C.expense,marginTop:5,fontWeight:600}}>
              Deductions exceed gross pay by {fmt(-netNum)}. Check the figures.
            </div>}

          {!o.isIncome &&
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,
                         paddingTop:10,borderTop:`1px solid ${o.posted?"#dbeafe":"#fdba74"}`}}>
              <span style={{fontSize:13,fontWeight:700}}>Total paid</span>
              <span style={{fontSize:18,fontWeight:800,color:C.text}}>{fmt(itemised)}</span>
            </div>}

          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:12}}>
            {o.posted && <Btn v="ghost" style={{padding:"7px 14px",fontSize:13}}
              onClick={()=>{setDraft(seedRowDraft(o));setExpanded(false);}}>Cancel</Btn>}
            <Btn style={{padding:"7px 16px",fontSize:13}} onClick={commitSplit}>OK</Btn>
          </div>
        </div>}

      {o.ticked && !o.isSplit && (!o.posted || expanded) &&
        <div style={{background:o.posted?"#f0f7ff":"#fff1e2",
                     border:`1px solid ${o.posted?"#dbeafe":"#fdba74"}`,
                     borderRadius:8,padding:"8px 10px",marginBottom:8}}>
          {o.awaiting &&
            <div style={{fontSize:11.5,fontWeight:700,color:"#9a3412",marginBottom:6}}>
              Enter the amount that actually hit your account
            </div>}
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,fontWeight:700,color:o.posted?C.accent:"#9a3412"}}>
              {o.forecast<0?"−":"+"}</span>
            <input type="number" inputMode="decimal" step="0.01"
              autoFocus={o.awaiting}
              placeholder="0.00"
              value={draft.amount} onChange={ev=>setDraft(d=>({...d,amount:ev.target.value}))}
              style={{flex:1,minWidth:0,border:`1px solid ${o.posted?"#bfdbfe":"#fb923c"}`,
                      borderRadius:7,padding:"8px 9px",fontSize:16,outline:"none",
                      background:"#fff",fontWeight:600}}/>
            {o.posted && <Btn v="ghost" style={{padding:"7px 12px",fontSize:12.5,flexShrink:0}}
              onClick={()=>{setDraft(seedRowDraft(o));setExpanded(false);}}>Cancel</Btn>}
            <Btn style={{padding:"7px 14px",fontSize:12.5,flexShrink:0}} onClick={commitSimple}>OK</Btn>
          </div>
        </div>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center",minWidth:0}}>
          {acctName && <Tag color={acctColor}>{acctName}</Tag>}
          {o.vendor && <span style={{fontSize:12,color:C.sub}}>{o.vendor}</span>}
          <Tag color={C.sub}>{o.category}</Tag>
          {o.logged && <Tag color={C.income}>logged</Tag>}
          {o.awaiting && <Tag color="#c2410c">needs amount</Tag>}
          {isLow && <Tag color={C.warn}>low point</Tag>}
        </div>
        {!o.logged &&
          <label style={{display:"flex",alignItems:"center",gap:7,userSelect:"none",flexShrink:0}}>
            <input type="checkbox" checked={o.ticked}
              onChange={ev=>ev.target.checked?check():uncheck()}
              style={{width:19,height:19,accentColor:o.posted?C.income:"#ea580c"}}/>
            <span style={{fontSize:13,color:C.sub,fontWeight:600}}>Cleared</span>
          </label>}
      </div>
    </div>
    {avail!==undefined &&
      <div style={{flex:"0 0 102px",background:isLow?"#fffbeb":"#eff6ff",
                   border:`1px solid ${isLow?"#fcd34d":"#bfdbfe"}`,borderRadius:10,
                   padding:"10px 6px"}}>
        <div style={{fontSize:8.5,fontWeight:700,color:C.sub,textTransform:"uppercase",
                     letterSpacing:".04em",textAlign:"right",marginBottom:3}}>Available</div>
        <div style={{fontWeight:700,fontSize:12,textAlign:"right",whiteSpace:"nowrap",
                     color:avail<0?C.expense:isLow?C.warn:C.accent}}>
          {isLow?"▼":""}{avail<0?"−":""}{fmt(avail)}
        </div>
      </div>}
    {o.posted && !expanded && !o.logged &&
      <div style={{flex:"0 0 102px",background:"#f0fdf4",border:"1px solid #bbf7d0",
                   borderRadius:10,padding:"10px 6px",display:"flex",flexDirection:"column",
                   alignItems:"stretch"}}>
        <div style={{fontSize:8.5,fontWeight:700,color:C.sub,textTransform:"uppercase",
                     letterSpacing:".04em",textAlign:"right",marginBottom:3}}>Confirmed</div>
        <Btn v="ghost" style={{padding:"5px 8px",fontSize:12,width:"100%"}}
          onClick={editDraft}>Edit</Btn>
      </div>}
    </div>
  );
}

// ── Budget row ─────────────────────────────────────────────
// The whole row is a tap target that opens a one-field sheet, matching how
// every other value in the app is entered. No inline inputs means no column of
// eleven fields for the keyboard to try to walk through.
const BudgetRow=React.memo(function BudgetRow({b,fmt,onTap,onReset}){
  const has=b.budget>0||b.spent>0||b.planned>0||Math.abs(b.carry)>0.005;
  const over=b.left<0;
  const denom=b.budget+b.carry;
  const committed=b.spent+b.planned;
  const pctSpent=denom>0?Math.min(100,Math.max(0,(b.spent/denom)*100)):(b.spent>0?100:0);
  const pctPlan=denom>0?Math.min(100-pctSpent,Math.max(0,(b.planned/denom)*100)):0;
  return (
    <Card style={{padding:0,overflow:"hidden"}}>
      <div onClick={()=>onTap(b)} style={{padding:"12px 13px",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10}}>
          <div style={{flex:1,minWidth:0,fontWeight:700,fontSize:15,overflow:"hidden",
                       textOverflow:"ellipsis",whiteSpace:"nowrap",color:has?C.text:C.sub}}>{b.cat}</div>
          {has
            ? <div style={{fontSize:15,fontWeight:800,flexShrink:0,color:over?C.expense:C.text}}>
                {over?"−":""}{fmt(b.left)}
                <span style={{fontSize:10.5,fontWeight:600,color:C.sub}}> left</span></div>
            : <div style={{fontSize:12.5,fontWeight:700,flexShrink:0,color:C.accent}}>Set budget</div>}
        </div>

        {has && <>
          <div style={{height:5,background:C.border,borderRadius:99,marginTop:10,
                       overflow:"hidden",display:"flex"}}>
            <div style={{height:"100%",width:pctSpent+"%",
              background:over?C.expense:pctSpent+pctPlan>85?C.warn:C.income}}/>
            <div style={{height:"100%",width:pctPlan+"%",
              background:over?C.expense+"66":C.income+"55"}}/>
          </div>
          <div style={{fontSize:11.5,color:C.sub,marginTop:7}}>
            {fmt(b.spent)} spent
            {b.planned>0?` · ${fmt(b.planned)} still due`:""}
            {" · of "+fmt(b.budget)}
          </div>
        </>}
      </div>

      {Math.abs(b.carry)>0.005 &&
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,
                     padding:"9px 13px",borderTop:`1px solid ${C.border}`,
                     background:b.carry<0?"#fef2f2":"#f0fdf4"}}>
          <span style={{fontSize:11.5,fontWeight:600,color:b.carry<0?C.expense:C.income}}>
            {b.carry<0?`${fmt(b.carry)} carried in`:`${fmt(b.carry)} under so far`}
          </span>
          <button onClick={()=>onReset(b)}
            style={{border:`1px solid ${C.border}`,background:C.card,borderRadius:7,
                    padding:"5px 11px",fontSize:11.5,color:C.sub,cursor:"pointer",flexShrink:0}}>
            Reset</button>
        </div>}
    </Card>
  );
});

                 display:"flex",alignItems:"flex-end",justifyContent:"center"}}

                     display:"flex",justifyContent:"space-between",alignItems:"center"}}>
